    <g font-family="Arial, sans-serif" font-size="10" fill="#334155">
      <text x="14" y="56">● logo — 品牌图形标识（左上）</text>
      <text x="14" y="80">● 电量 — 电池图标（顶部）</text>
      <text x="14" y="104">● 模式名 — 屏幕直接显示，不显示 MODE 标签</text>
      <text x="14" y="128">● <tspan fill="#7dd3fc">STR:</tspan> — 强度 1–99（大字号核心）</text>
      <text x="14" y="152">● 时间 — 时钟图标 + 7段码数值 + MIN（如 20 MIN）</text>
      <text x="14" y="176">● 锁定 — 锁图标（右上，A 屏；B 屏暂停后可叠加）</text>
      <text x="14" y="200">● 暂停 — ▶|| 图标（右上，B 屏；可与锁定叠加）</text>
      <text x="14" y="224">● 断连 — Disconnect 插头图标（屏幕提示）</text>
      <text x="14" y="248">● 电极异常 — 矩形斜杠断开图标（E 屏，黄色告警）</text>
      <text x="14" y="272">● 当前/总组数 — 如 1/12（历史单组屏 D，红色）</text>
    </g>
