<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的研究知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8f9fa;--sidebar-bg:#fff;--card-bg:#fff;
  --ink:#1a1a2e;--muted:#6b7280;--light:#9ca3af;
  --line:#e5e7eb;--hover:#f3f4f6;--hover2:#eef2f7;
  --accent:#236b6f;--accent-light:#e8f4f3;--accent-dark:#1a5559;
  --danger:#e53e3e;--warning:#d97706;
  --radius:8px;--radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --sidebar-w:280px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}

/* ===== HEADER ===== */
.header{
  background:#fff;border-bottom:1px solid var(--line);
  height:56px;display:flex;align-items:center;
  padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-icon{
  width:32px;height:32px;background:var(--accent);
  border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;
}
.logo-text{font-size:16px;font-weight:700;color:var(--ink)}
.search-bar{flex:1;max-width:500px;position:relative}
.search-bar input{
  width:100%;padding:8px 12px 8px 36px;
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:13px;background:var(--bg);transition:all .2s;
}
.search-bar input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(35,107,111,.1)}
.search-bar i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--light);font-size:13px}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .15s;
}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.active{background:var(--accent-light);color:var(--accent)}
.badge{
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:8px;position:absolute;top:4px;right:4px;
}
.admin-entry{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:13px;font-weight:600;color:var(--ink);background:#fff;cursor:pointer;transition:all .15s;
}
.admin-entry:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.admin-entry i{font-size:14px}
.admin-entry-txt{font-size:13px}

/* 移动端汉堡按钮(默认隐藏, 仅 @media 显示) */
.menu-toggle{display:none;width:36px;height:36px;border-radius:var(--radius);align-items:center;justify-content:center;color:var(--muted);font-size:17px;flex-shrink:0}
.menu-toggle:hover{background:var(--hover);color:var(--ink)}
/* 移动端侧边栏遮罩(点遮罩收起抽屉) */
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:95;opacity:0;pointer-events:none;transition:opacity .25s}

/* ===== LAYOUT ===== */
.layout{display:flex;min-height:calc(100vh - 56px)}

/* ===== SIDEBAR ===== */
.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);
  border-right:1px solid var(--line);padding:12px 0;
  overflow-y:auto;position:sticky;top:56px;
  height:calc(100vh - 56px);flex-shrink:0;
}
.sidebar-section{padding:0 8px;margin-bottom:8px}
.sidebar-label{font-size:11px;font-weight:600;color:var(--light);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 4px}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:var(--radius);
  font-size:13px;font-weight:500;color:var(--ink);
  cursor:pointer;transition:all .12s;user-select:none;
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-light);color:var(--accent)}
.nav-item i{width:16px;text-align:center;font-size:13px;color:var(--muted)}
.nav-item.active i{color:var(--accent)}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--light)}
.nav-children{padding-left:12px}
.nav-child{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px 5px 36px;border-radius:6px;
  font-size:12px;color:var(--muted);cursor:pointer;
  transition:all .12s;
}
.nav-child:hover{background:var(--hover);color:var(--ink)}
.nav-child.active{color:var(--accent);font-weight:600}
.nav-child .count{margin-left:auto;font-size:10px;color:var(--light)}
.tree-chevron{font-size:10px;transition:transform .2s;color:var(--light)}
.tree-chevron.open{transform:rotate(90deg)}
.sidebar-add{
  margin:8px 12px;padding:8px;border:1px dashed var(--line);
  border-radius:var(--radius);text-align:center;font-size:12px;
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.sidebar-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* ===== MAIN CONTENT ===== */
.main{flex:1;padding:24px;overflow-x:hidden;min-width:0}
.main-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.main-title{font-size:20px;font-weight:700}
.main-tools{display:flex;gap:8px;align-items:center}
.sort-select{
  padding:6px 12px;border:1px solid var(--line);border-radius:6px;
  font-size:12px;background:#fff;color:var(--ink);cursor:pointer;
}
.view-btn{
  width:32px;height:32px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .15s;
}
.view-btn:hover,.view-btn.active{background:var(--hover);color:var(--accent)}

/* ===== FILE GRID ===== */
.file-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;
}
.file-card{
  background:var(--card-bg);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:16px;
  cursor:pointer;transition:all .2s;position:relative;
  display:flex;flex-direction:column;gap:8px;
}
.file-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:#d1d5db}
.file-card-top{display:flex;align-items:flex-start;gap:10px}
.file-card-icon{
  width:36px;height:36px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.file-card-body{flex:1;min-width:0}
.file-card-title{
  font-size:14px;font-weight:600;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.file-card-cat{font-size:11px;color:var(--light);margin-top:3px}
.file-card-tags{display:flex;flex-wrap:wrap;gap:4px}
.file-tag{
  font-size:10px;padding:2px 7px;border-radius:4px;
  background:#f0f0f0;color:var(--muted);
}
.file-card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:8px;border-top:1px solid #f5f5f5;
  font-size:11px;color:var(--light);
}
.file-card-footer .left{display:flex;gap:10px;align-items:center}
.fmt-badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:4px;line-height:1.4;white-space:nowrap}
.li-fmt{flex-shrink:0;display:flex;align-items:center;width:74px}
.fav-btn{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--light);transition:all .15s;flex-shrink:0;
}
.fav-btn:hover{background:var(--hover);color:var(--warning)}
.fav-btn.active{color:var(--warning)}

/* ===== FILE LIST VIEW ===== */
.file-list{display:flex;flex-direction:column;gap:2px}
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:var(--radius);cursor:pointer;
  transition:all .12s;
}
.list-item:hover{background:var(--hover)}
.list-item .li-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.list-item .li-title{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-cat{font-size:11px;color:var(--light);flex-shrink:0}
.list-item .li-date{font-size:11px;color:var(--light);flex-shrink:0;width:80px}
.list-item .li-size{font-size:11px;color:var(--light);flex-shrink:0;width:60px;text-align:right}

/* ===== EMPTY ===== */
.empty-state{text-align:center;padding:80px 20px;color:var(--light)}
.empty-state i{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:14px}

/* ===== ADMIN PANEL ===== */
.admin-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  backdrop-filter:blur(4px);display:none;
}
.admin-overlay.show{display:flex;align-items:center;justify-content:center}
.admin-box{
  background:#fff;border-radius:var(--radius-lg);width:420px;
  padding:32px;box-shadow:var(--shadow-lg);
}
.admin-box h2{font-size:18px;margin-bottom:8px;text-align:center}
.admin-box p{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}
.admin-box input{
  width:100%;padding:10px 14px;border:1px solid var(--line);
  border-radius:var(--radius);font-size:14px;margin-bottom:12px;
}
.admin-box input:focus{outline:none;border-color:var(--accent)}
.admin-box .btn{
  width:100%;padding:10px;border-radius:var(--radius);
  font-size:14px;font-weight:600;transition:all .15s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.admin-error{color:var(--danger);font-size:12px;text-align:center;min-height:18px}

/* ===== ADMIN VIEW ===== */
.admin-view{padding:24px}
.admin-bar{position:sticky;top:56px;z-index:50;background:#fff;padding:8px 0 12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.admin-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.admin-tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:8px}
.admin-tab{
  padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.admin-tab.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.admin-section{display:none}
.admin-section.show{display:block}

/* Upload area */
.upload-zone{
  border:2px dashed var(--line);border-radius:var(--radius-lg);
  padding:40px;text-align:center;cursor:pointer;transition:all .2s;
  margin-bottom:16px;
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-light)}
.upload-zone i{font-size:36px;color:var(--light);margin-bottom:12px}
.upload-zone p{font-size:13px;color:var(--muted)}
.upload-zone .hint{font-size:11px;color:var(--light);margin-top:4px}

/* Admin file table */
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{
  text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--light);text-transform:uppercase;
}
.admin-table td{padding:8px 12px;border-bottom:1px solid #f5f5f5}
.admin-table tr:hover{background:var(--hover)}
.admin-table .actions{display:flex;gap:4px}
.admin-table .act-btn{
  width:28px;height:28px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .15s;
}
.admin-table .act-btn:hover{background:var(--hover2)}
.admin-table .act-btn.danger:hover{background:#fee;color:var(--danger)}

/* 文件管理：合并在线+已删除 + 筛选标签 */
.af-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.af-filters{display:flex;gap:6px}
.af-filter{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none;transition:all .15s}
.af-filter:hover{background:var(--hover)}
.af-filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.af-count{font-size:11px;opacity:.8;margin-left:4px}
.af-badge{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.af-badge.online{background:#e7f6ee;color:#1f9d57}
.af-badge.deleted{background:#fdecec;color:var(--danger)}
.af-del-row td{color:var(--muted)}

/* Category editor */
.cat-editor{display:flex;flex-direction:column;gap:8px}
.cat-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);
}
.cat-row .cat-name{flex:1;font-size:13px;font-weight:500}
.cat-row .act-btn{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s}
.cat-row .act-btn:hover{background:var(--hover2)}

/* Tag editor */
.tag-editor{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);min-height:48px}
.tag-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:6px;background:var(--accent-light);
  color:var(--accent);font-size:12px;font-weight:500;
}
.tag-chip .remove{cursor:pointer;opacity:.6}
.tag-chip .remove:hover{opacity:1}
.tag-input-row{display:flex;gap:8px;margin-top:8px}
.tag-input-row input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:#fff;border-radius:var(--radius-lg);
  width:90%;max-width:500px;box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-body input,.modal-body select{
  width:100%;padding:8px 12px;border:1px solid var(--line);
  border-radius:var(--radius);font-size:13px;margin-bottom:10px;
}
.modal-body input:focus,.modal-body select:focus{outline:none;border-color:var(--accent)}
.modal-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.btn-sm{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600}
.btn-ghost{background:var(--hover);color:var(--ink)}
.btn-ghost:hover{background:var(--hover2)}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:8px;
  font-size:13px;z-index:500;box-shadow:var(---shadow-lg);
  opacity:0;transition:opacity .3s,bottom .3s;pointer-events:none;
}
.toast.show{opacity:1;bottom:32px}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .menu-toggle{display:flex}
  .sidebar{position:fixed;top:56px;left:-280px;bottom:0;z-index:99;transition:left .25s ease;box-shadow:2px 0 18px rgba(0,0,0,.14)}
  .sidebar.show{left:0}
  .sidebar-backdrop{display:block;opacity:0;pointer-events:none}
  .sidebar-backdrop.show{opacity:1;pointer-events:auto}
  .main{padding:16px}
  .file-grid{grid-template-columns:1fr}
  .logo-text{display:none}
}
@media(max-width:560px){
  .header{gap:10px;padding:0 14px}
  .admin-entry-txt{display:none}
  .search-bar input{padding-left:34px}
}

/* ===== VIEWER GATE（查看密码，防止外人直接浏览全部文件） ===== */
.viewer-lock{
  position:fixed;inset:0;background:rgba(20,22,40,.97);z-index:400;
  display:none;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)
}
.viewer-lock.show{display:flex}
.vl-box{background:#fff;border-radius:16px;width:380px;max-width:90vw;padding:34px 32px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.vl-icon{width:58px;height:58px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px}
.vl-box h2{font-size:18px;margin-bottom:6px}
.vl-box p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.vl-chk{display:flex;align-items:center;gap:7px;justify-content:center;margin:-6px 0 16px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.vl-box input[type=password]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;box-sizing:border-box}
.vl-box input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(35,107,111,.12)}
.vl-box .btn{width:100%;padding:11px;border-radius:8px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:none;cursor:pointer;transition:all .15s}
.vl-box .btn:hover{background:var(--accent-dark)}
.vl-err{color:var(--danger);font-size:12px;min-height:16px}

/* 自定义分类下拉(select 透明叠 div): 选中后显示"一级 - 二级"完整路径, 下拉打开的 option 仍用简短名 */
.cat-select-wrap{position:relative;width:100%}
.cat-select-display{position:relative;padding:8px 28px 8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);font-size:14px;color:var(--text);min-height:18px;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;line-height:20px}
.cat-select-display::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none}
.cat-select-display.placeholder{color:var(--muted)}
.cat-select-real{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;background:transparent;padding:0;margin:0}
.cat-select-real:focus{outline:none}
.cat-select-real:focus + .cat-select-display{border-color:var(--accent)}
</style>
</head>
<body>

<!-- Font Awesome (本地托管，避免依赖国外 CDN 导致图标不显示) -->
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

<!-- Header -->
<div class="header">
  <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" title="菜单 / 分类" aria-label="打开菜单"><i class="fas fa-bars"></i></button>
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-book-open"></i></div>
    <span class="logo-text">我的研究知识库</span>
  </div>
  <div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="搜索文件名、标签、分类..." autocomplete="off">
  </div>
  <div class="header-right">
    <button class="icon-btn" id="favBtn" title="收藏夹"><i class="fas fa-star"></i></button>
    <button class="icon-btn" id="recentBtn" title="最近访问"><i class="fas fa-clock-rotate-left"></i></button>
    <button class="admin-entry" id="adminBtn"><i class="fas fa-gear"></i> <span class="admin-entry-txt">管理后台</span></button>
  </div>
</div>

<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>
  <!-- Main -->
  <div class="main" id="main"></div>
</div>

<!-- 移动端侧边栏遮罩(点此收起) -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<!-- Admin Login -->
<div class="admin-overlay" id="adminLogin">
  <div class="admin-box">

// 直读 raw.githubusercontent.com 的 manifest.json —— 永远最新, 无需等 Pages 构建(~1分钟)
// 由当前页地址推导: https://<user>.github.io/<repo>/... -> raw/<user>/<repo>/<branch>/manifest.json
function rawManifestUrl() {
  try {
    var u = new URL(location.href);
    if (u.hostname.endsWith('.github.io')) {
      var parts = u.pathname.split('/').filter(function(p) { return p; }); // ['database', 'index.html']
      if (parts.length >= 1) {
        var user = u.hostname.split('.')[0];
        var repo = parts[0];
        var branch = 'main'; // 与仓库默认分支保持一致(如需改分支, 只改这里)
        return 'https://raw.githubusercontent.com/' + user + '/' + repo + '/' + branch + '/manifest.json';
      }
    }
  } catch (e) {}
  // 本地预览 / 非 Pages 环境: 退回同源 manifest(无 raw 可直读)
  return 'manifest.json?t=' + Date.now();
}

// 直读 raw.githubusercontent.com 的 meta.json(分类/标签等云端元数据) —— 与 manifest 同理
function metaUrl() {
  try {
    var u = new URL(location.href);
    if (u.hostname.endsWith('.github.io')) {
      var parts = u.pathname.split('/').filter(function(p) { return p; });
      if (parts.length >= 1) {
        var user = u.hostname.split('.')[0];
        var repo = parts[0];
        var branch = 'main'; // 与仓库默认分支保持一致(如需改分支, 只改这里)
        return 'https://raw.githubusercontent.com/' + user + '/' + repo + '/' + branch + '/meta.json';
      }
    }
  } catch (e) {}
  // 本地预览 / 非 Pages 环境: 退回同源 meta.json
  return 'meta.json?t=' + Date.now();
}

// 拉取云端元数据覆盖本地分类/标签(云端为权威源); 首次(404)用本地数据初始化云端
// 读取策略: 优先直读 raw; 若 raw 被墙/超时(国内常见), 自动经 SCF 中继读取, 避免退回陈旧本地数据
function loadMeta(cb) {
  fetchMeta().then(function(res) {
    if (!res) { if (cb) cb(); return; }            // 两端都失败: 保留本机数据
    if (res.missing) { syncMetaToCloud(); if (cb) cb(); return; } // 首次: 本地数据推上云
    applyMeta(res.data);
    if (cb) cb();
    renderSidebar(); renderMain();
  }).catch(function() { if (cb) cb(); });
}
// raw + SCF 中继读取 meta.json; 解析为 {data} / {missing} / null
function fetchMeta() {
  return new Promise(function(resolve) {
    var done = false;
    var tryScf = function() {
      if (done) return;
      fetchMetaViaSCF(function(m) { if (done) return; done = true; resolve(m ? { data: m } : null); });
    };
    fetch(metaUrl() + '?t=' + Date.now()).then(function(r) {
      if (r.status === 404) { if (done) return; done = true; resolve({ missing: true }); return; }
      if (!r.ok) { tryScf(); return; }
      return r.json();
    }).then(function(d) {
      if (d === undefined) return; // 已被 404 分支处理
      if (done) return;
      done = true;
      resolve(d ? { data: d } : null);
    }).catch(function() { tryScf(); });
  });
}
// 处理云端 meta 数据(合并逻辑集中在此, loadMeta 调用)
function applyMeta(d) {
  if (!d) return;
  // 分类: 云端+本机取并集(按 id); 同 id 冲突时取 updatedAt 更新的一方(最近写入优先),
  // 避免"改名后同步失败→刷新被云端旧名覆盖"以及"换设备时旧缓存覆盖云端新数据"
  if (Array.isArray(d.customCats)) {
    var cloudCats = d.customCats;
    var localCats = (S.customCats || []).slice();
    var map = {};
    cloudCats.concat(localCats).forEach(function(c){
      if (!c || !c.id) return;
      var ex = map[c.id];
      if (!ex) map[c.id] = c;
      else if ((c.updatedAt||0) > (ex.updatedAt||0)) map[c.id] = c;
    });
    var merged = [];
    Object.keys(map).forEach(function(k){ merged.push(map[k]); });
    S.customCats = merged;
    // 本机有更新/更新的分类(新增或改名) -> 已登录则立即补传到云端(让其他设备也能看到)
    var hasLocalNewer = localCats.some(function(c){
      if (!c || !c.id) return false;
      var cl = cloudCats.find(function(x){ return x && x.id===c.id; });
      return !cl || (c.updatedAt||0) > (cl.updatedAt||0);
    });
    if (hasLocalNewer && S.adminToken) syncMetaToCloud();
  }
  if (d.fileCats && typeof d.fileCats === 'object') {
    // fileCats: 云端为权威源, 但保留本机独有项
    var localFC = S.fileCats || {};
    S.fileCats = d.fileCats;
    Object.keys(localFC).forEach(function(fn) { if (!(fn in S.fileCats)) S.fileCats[fn] = localFC[fn]; });
  }
  if (d.fileTags && typeof d.fileTags === 'object') {
    // fileTags: 同 fileCats
    var localFT = S.fileTags || {};
    S.fileTags = d.fileTags;
    Object.keys(localFT).forEach(function(fn) { if (!(fn in S.fileTags)) S.fileTags[fn] = localFT[fn]; });
  }
  // allTags: 云端+本机取并集, 但排除本机已删除的标签(防止删除后刷新从云端复活)
  if (Array.isArray(d.allTags)) {
    var cloudTags = d.allTags;
    var localTags = (S.allTags || []).slice();
    var deleted = (S.deletedTags || []).slice();
    var seenT = {}; var mergedT = [];
    cloudTags.concat(localTags).forEach(function(t) {
      if (!t || seenT[t] || deleted.indexOf(t) >= 0) return;
      seenT[t] = true; mergedT.push(t);
    });
    S.allTags = mergedT;
    // 本机有而云端没有的标签(且未被删除) -> 已登录则补传
    var hasLocalOnlyT = localTags.some(function(t) { return t && cloudTags.indexOf(t) < 0 && deleted.indexOf(t) < 0; });
    if (hasLocalOnlyT && S.adminToken) syncMetaToCloud();
  }
  // 分类顺序: 取 catOrderUpdatedAt 更新的一方(最近排序优先), 本机更新且已登录则补传
  if (Array.isArray(d.catOrder)) {
    var cloudAt = d.catOrderUpdatedAt || 0;
    var localAt = S.catOrderUpdatedAt || 0;
    if (cloudAt > localAt) {
      S.catOrder = d.catOrder.slice();
      S.catOrderUpdatedAt = cloudAt;
    } else if (localAt > 0 && localAt > cloudAt && S.adminToken) {
      syncMetaToCloud();
    }
  }
  // 已删除分类: 云端+本机取并集(删除不可逆, 任何一端删过都不复活)
  if (Array.isArray(d.deletedCats)) {
    var seenD = {}; var mergedD = [];
    (d.deletedCats || []).concat(S.deletedCats || []).forEach(function(id) {
      if (id && !seenD[id]) { seenD[id] = true; mergedD.push(id); }
    });
    S.deletedCats = mergedD;
  }
}

// 把分类/标签推送到云端 meta.json(管理员令牌鉴权, 最近写入优先; 防抖合并)
var _metaTimer = null;
var _pendingMetaSync = false; // 本机有待补传到云端的改动(登录/解锁后自动补传)
// 强制重新登录弹窗(令牌过期时调用), 并标记"有待补传到云端的本地改动"
function promptRelogin(msg) {

    var e = document.getElementById('adminError');
    if (e && msg) e.textContent = msg;
    var box = document.getElementById('adminLogin');

// relogin=true(默认): 令牌过期 -> 切回未登录界面并弹重新登录; relogin=false: 仅提示(如切后台时静默失效)
function clearAdminToken(relogin) {
  S.adminToken = '';
  S.isAdmin = false;
  try { localStorage.removeItem('kb_admin_token'); sessionStorage.removeItem('kb_admin_token'); } catch (e) {}
  renderSidebar(); renderMain();
  if (relogin === false) { toast('后台登录已过期，请重新登录以同步分类/标签到云端', false); }
  else { promptRelogin('后台登录已过期，请重新登录以同步分类/标签到云端'); }
}
// 页面卸载/隐藏前的同步兜底(尽力送达, 避免分类因未刷新而丢失)
function flushMetaNow() {
  if (!S.adminToken) return false;
  var data = {
    customCats: S.customCats || [],
    fileCats: S.fileCats || {},
    fileTags: S.fileTags || {},
    allTags: S.allTags || [],
    deletedTags: S.deletedTags || [],
    deletedCats: S.deletedCats || [],
    catOrder: S.catOrder || [],
    catOrderUpdatedAt: S.catOrderUpdatedAt || 0
  };
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', UPLOAD_API, false);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('x-admin-token', S.adminToken);
    xhr.send(JSON.stringify({ op: 'meta', data: data }));
    if (xhr.status === 401) { clearAdminToken(false); return false; }
    return xhr.status < 300;
  } catch (e) { return false; }
}
function syncMetaToCloud() {
  if (!S.adminToken) return; // 仅管理员可写云端元数据(未登录则仅本机可见)
  _pendingMetaSync = true;
  if (_metaTimer) clearTimeout(_metaTimer);
  _metaTimer = setTimeout(function() {
    _pendingMetaSync = false;
    var data = {
      customCats: S.customCats || [],
      fileCats: S.fileCats || {},
      fileTags: S.fileTags || {},
      allTags: S.allTags || [],
      deletedTags: S.deletedTags || [],
      deletedCats: S.deletedCats || [],
      catOrder: S.catOrder || [],
      catOrderUpdatedAt: S.catOrderUpdatedAt || 0
    };
    fetch(UPLOAD_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': S.adminToken },
      body: JSON.stringify({ op: 'meta', data: data })
    }).then(function(r) {
      if (r.status === 401) { clearAdminToken(); } // 令牌过期: 弹重新登录并排队补传
      else if (!r.ok) { toast('分类保存到云端失败（服务端错误 ' + r.status + '），已暂存本机', false); }
    }).catch(function(e) { toast('分类保存失败（网络错误），已暂存本机', false); });
  }, 150);
}
// 页面隐藏/卸载前兜底送达, 避免分类因未刷新而丢失
document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') flushMetaNow(); });

// Load the dynamic manifest (rewritten by the upload function after each upload).
// 优先直读 raw(无构建延迟); 若 raw 被墙/超时(国内常见), 自动经腾讯云 SCF 中继读取(国内稳定),
// 二者皆失败才退回嵌入数据 —— 杜绝"上传成功却看不到"因读取失败退回陈旧内置列表。
(function loadManifest() {
  var url = rawManifestUrl() + '?t=' + Date.now(); // 实时缓存破坏, 永远拉最新
  fetch(url).then(function(r) { return r.json(); }).then(function(d) {
    if (Array.isArray(d) && d.length) { FILES = d; renderSidebar(); renderMain(); return; }
    fetchManifestViaSCF(function(m) { if (m) { FILES = m; renderSidebar(); renderMain(); } });
  }).catch(function() {
    fetchManifestViaSCF(function(m) { if (m) { FILES = m; renderSidebar(); renderMain(); } });
  });
})();

function esc(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtDate(ts) { var d=new Date(ts*1000); var p=function(n){return String(n).padStart(2,'0');}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtSize(b) { if(b<1048576) return Math.round(b/1024)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function toast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')},2500); }

function getAllFiles() {
  var uploaded = S.uploaded.map(function(f) {
    return {filename:f.name, title:f.title||f.name, size:f.size, mtime:f.mtime, category:f.category||'other', isUploaded:true, data:f.data};
  });
  // 按文件名去重: 同一文件可能同时存在于云端 manifest 与本地兜底, 只显示一次
  var seen = {}; var out = [];
  FILES.concat(uploaded).forEach(function(f) {
    if (!f || !f.filename) return;
    if (seen[f.filename]) return;
    seen[f.filename] = true; out.push(f);
  });
  return out;
}

function getFileCat(filename) {
  if (S.fileCats[filename]) return S.fileCats[filename];
  var f = getAllFiles().find(function(f) { return f.filename === filename; });
  return f ? f.category : 'other';
}

// 深拷贝内置分类树(避免 getTree 覆盖/排序时污染全局 TREE, 导致删除 override 无法恢复默认)
function cloneTree() {
  return TREE.map(function(c){
    var n = { id: c.id, name: c.name, icon: c.icon || 'fas fa-folder' };
    if (c.children) {
      n.children = c.children.map(function(ch){
        return { id: ch.id, name: ch.name, icon: ch.icon || 'fas fa-file' };
      });
    }
    return n;
  });
}

// 合并分类树: 内置 TREE(克隆) + 自定义分类; 带 parentId 的自定义分类挂到对应父分类 children 下(成为二级分类), 否则作为顶级分类;
// customCats 中与内置分类同 id 的条目会覆盖内置(用于内置分类改名/换图标)
function getTree() {
  var tree = cloneTree();
  (S.customCats || []).forEach(function(c){
    if (!c || !c.id) return;
    var idx = tree.findIndex(function(x){ return x.id === c.id; });
    if (idx >= 0) { tree[idx] = c; return; } // 覆盖内置顶级分类
    if (c.parentId) {
      var p = tree.find(function(x){ return x.id === c.parentId; });
      if (p) {
        if (!p.children) p.children = [];
        var ci = p.children.findIndex(function(ch){ return ch.id === c.id; });
        if (ci >= 0) { p.children[ci] = c; return; } // 覆盖内置二级分类
        p.children.push(c);
        return;
      }
      // 父分类不存在: 退化为顶级分类
    }
    tree.push(c);
  });
  // 过滤已删除的分类(一级 + 二级)
  var del = S.deletedCats || [];
  tree = tree.filter(function(c){ return del.indexOf(c.id) < 0; });
  tree.forEach(function(c){
    if (c.children) c.children = c.children.filter(function(ch){ return del.indexOf(ch.id) < 0; });
  });
  return sortTree(tree);
}

// 按 S.catOrder(id 数组) 排序分类树: 一级按顺序, 二级在各自父级内按顺序; 未列出的保持默认顺序排后
function sortTree(tree) {
  var order = S.catOrder || [];
  if (!order.length) return tree;
  var rank = {};
  order.forEach(function(id, i){ rank[id] = i; });
  var tops = tree.filter(function(c){ return !c.parentId; });
  tops.sort(function(a,b){ return (rank[a.id]!=null?rank[a.id]:1e9) - (rank[b.id]!=null?rank[b.id]:1e9); });
  tops.forEach(function(c){
    if (c.children && c.children.length) {
      c.children.sort(function(a,b){ return (rank[a.id]!=null?rank[a.id]:1e9) - (rank[b.id]!=null?rank[b.id]:1e9); });
    }
  });
  return tops;
}

// 分类上移/下移(dir=-1 上移, 1 下移): 在"同级分类"内交换位置, 顺序持久化到本地并同步云端
function moveCatOrder(catId, dir) {
  var tree = getTree();
  var sibs = null;
  for (var i=0;i<tree.length;i++) {
    var c = tree[i];
    if (c.id === catId) { sibs = tree.filter(function(x){ return !x.parentId; }); break; }
    if (c.children) {
      var ch = c.children.find(function(x){ return x.id===catId; });
      if (ch) { sibs = c.children; break; }
    }
  }
  if (!sibs) return;
  var ids = sibs.map(function(x){ return x.id; });
  var pos = ids.indexOf(catId);
  var target = pos + dir;
  if (target < 0 || target >= ids.length) { toast('已经是第一个/最后一个了'); return; }
  var order = (S.catOrder || []).slice();
  ids.forEach(function(id){ if (order.indexOf(id) < 0) order.push(id); });
  var a = order.indexOf(catId), b = order.indexOf(ids[target]);
  if (a < 0 || b < 0) return;
  var t = order[a]; order[a] = order[b]; order[b] = t;
  S.catOrder = order;
  S.catOrderUpdatedAt = Date.now();
  Save(); renderAdminCats(); renderSidebar(); renderMain();
}

function catName(catId) {
  if (catId === 'other') return '未分类';
  for (var i=0; i<TREE.length; i++) {
    if (TREE[i].id === catId) return TREE[i].name;
    if (TREE[i].children) {
      for (var j=0; j<TREE[i].children.length; j++) {
        if (TREE[i].children[j].id === catId) return TREE[i].children[j].name;
      }
    }
  }
  for (var k=0; k<S.customCats.length; k++) {
    if (S.customCats[k].id === catId) return S.customCats[k].name;
  }
  return catId;
}

function catIcon(catId) {
  for (var i=0; i<TREE.length; i++) {
    if (TREE[i].id === catId) return TREE[i].icon||'fas fa-folder';
    if (TREE[i].children) {
      for (var j=0; j<TREE[i].children.length; j++) {
        if (TREE[i].children[j].id === catId) return TREE[i].children[j].icon||'fas fa-file';
      }
    }
  }
  for (var k=0; k<S.customCats.length; k++) {
    if (S.customCats[k].id === catId) return S.customCats[k].icon||'fas fa-folder';
  }
  return 'fas fa-folder';
}

// 按扩展名返回文件图标(支持任意类型后,让混合文件列表更直观)
function fileIcon(filename) {
  var ext = (String(filename).split('.').pop() || '').toLowerCase();

    'pdf':'fa-file-pdf',
    'png':'fa-file-image','jpg':'fa-file-image','jpeg':'fa-file-image','gif':'fa-file-image',

function fileExt(filename) {

}
function fileFmt(filename) {

    'mp3':'MP3','wav':'WAV','flac':'FLAC',
    'txt':'TXT','md':'Markdown'
  };
  return labels[ext] || (ext ? ext.toUpperCase() : 'FILE');
}

function getFilteredFiles() {
  var all = getAllFiles();
  var filtered = all;

  if (S.showFav) {
    filtered = filtered.filter(function(f) { return S.favorites.indexOf(f.filename) >= 0; });
  } else if (S.showRecent) {
    filtered = S.recent.map(function(fn) { return all.find(function(f) { return f.filename === fn; }); }).filter(Boolean);
  } else if (S.cat !== 'all') {
    filtered = filtered.filter(function(f) { return getFileCat(f.filename) === S.cat; });
  }

  if (S.search) {
    var q = S.search.toLowerCase();
    filtered = filtered.filter(function(f) {
      if (f.title.toLowerCase().indexOf(q) >= 0) return true;
      if (f.filename.toLowerCase().indexOf(q) >= 0) return true;
      if (catName(getFileCat(f.filename)).toLowerCase().indexOf(q) >= 0) return true;
      var tags = S.fileTags[f.filename] || [];
      for (var i=0; i<tags.length; i++) { if (tags[i].toLowerCase().indexOf(q) >= 0) return true; }
      return false;
    });
  }

  filtered.sort(function(a,b) {
    switch(S.sort) {
      case 'date-desc': return b.mtime - a.mtime;
      case 'date-asc': return a.mtime - b.mtime;
      case 'name-asc': return a.title.localeCompare(b.title, 'zh');
      case 'name-desc': return b.title.localeCompare(a.title, 'zh');
      case 'size-desc': return b.size - a.size;
      case 'size-asc': return a.size - b.size;
    }
    return 0;
  });
  return filtered;
}

// ===== RENDER SIDEBAR =====
function renderSidebar() {
  if (!S.viewUnlocked) return;
  var sb = document.getElementById('sidebar');
  var all = getAllFiles();
  var html = '';

  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-label">浏览</div>';
  html += '<div class="nav-item' + (S.cat==='all' && !S.showFav && !S.showRecent ? ' active' : '') + '" onclick="selectCat(\'all\')">';
  html += '<i class="fas fa-folder-open"></i> 全部文件 <span class="count">'+all.length+'</span></div>';
  html += '<div class="nav-item' + (S.showFav ? ' active' : '') + '" onclick="showFavorites()">';
  html += '<i class="fas fa-star"></i> 收藏 <span class="count">'+S.favorites.length+'</span></div>';
  html += '<div class="nav-item' + (S.showRecent ? ' active' : '') + '" onclick="showRecent()">';
  html += '<i class="fas fa-clock-rotate-left"></i> 最近访问 <span class="count">'+S.recent.length+'</span></div>';
  html += '</div>';

  // Category tree
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-label">分类目录</div>';

  getTree().forEach(function(cat) {
    if (cat.children) {
      var isExp = S.expanded[cat.id] !== false;
      var childCount = cat.children.reduce(function(acc, c) {
        return acc + all.filter(function(f) { return getFileCat(f.filename) === c.id; }).length;
      }, 0);
      var catFiles = all.filter(function(f) { return getFileCat(f.filename) === cat.id; }).length;
      var totalCount = childCount + catFiles;

      html += '<div class="nav-item" onclick="toggleCat(\''+cat.id+'\')">';
      html += '<i class="fas fa-chevron-right tree-chevron'+(isExp?' open':'')+'"></i>';
      html += '<i class="'+(cat.icon||'fas fa-folder')+'"></i> '+esc(cat.name);
      html += '<span class="count">'+totalCount+'</span></div>';

      if (isExp) {
        html += '<div class="nav-children">';
        // Parent category files
        if (catFiles > 0) {
          html += '<div class="nav-child'+(S.cat===cat.id?' active':'')+'" onclick="event.stopPropagation();selectCat(\''+cat.id+'\')">';
          html += '<i class="fas fa-dot-circle"></i> 未归类 <span class="count">'+catFiles+'</span></div>';
        }
        cat.children.forEach(function(child) {
          var count = all.filter(function(f) { return getFileCat(f.filename) === child.id; }).length;
          if (count === 0) return;
          html += '<div class="nav-child'+(S.cat===child.id?' active':'')+'" onclick="event.stopPropagation();selectCat(\''+child.id+'\')">';
          html += '<i class="'+(child.icon||'fas fa-file')+'"></i> '+esc(child.name)+' <span class="count">'+count+'</span></div>';
        });
        html += '</div>';
      }
    } else {
      var count = all.filter(function(f) { return getFileCat(f.filename) === cat.id; }).length;
      if (count === 0 && cat.id === 'other') return;
      html += '<div class="nav-item'+(S.cat===cat.id?' active':'')+'" onclick="selectCat(\''+cat.id+'\')">';
      html += '<i class="'+(cat.icon||'fas fa-folder')+'"></i> '+esc(cat.name)+' <span class="count">'+count+'</span></div>';
    }
  });

  html += '</div>';

  // Tags section
  if (S.allTags.length > 0) {
    html += '<div class="sidebar-section">';
    html += '<div class="sidebar-label">标签</div>';
    S.allTags.slice(0, 15).forEach(function(tag) {
      html += '<div class="nav-item" onclick="searchTag(\''+esc(tag)+'\')" style="font-size:12px">';
      html += '<i class="fas fa-tag" style="font-size:10px"></i> #'+esc(tag)+'</div>';
    });
    html += '</div>';
  }

  // Add category button (admin only)
  if (S.isAdmin) {
    html += '<div class="sidebar-add" onclick="addCategoryModal()">';
    html += '<i class="fas fa-plus"></i> 新增分类</div>';
  }

  sb.innerHTML = html;
}

      html += '<button class="fav-btn'+(isFav?' active':'')+'" style="width:24px;height:24px" onclick="event.stopPropagation();toggleFav(\''+esc(f.filename)+'\')"><i class="fas fa-star"></i></button>';
      html += '</div>';
    });
    html += '</div>';
  }

  main.innerHTML = html;

  document.getElementById('sortSelect').onchange = function(e) {

  };
}

// ===== FILE OPERATIONS =====
function openFile(filename, title) {
  // Add to recent
  S.recent = [filename].concat(S.recent.filter(function(f) { return f !== filename; })).slice(0, 20);
  Save();

  var file = getAllFiles().find(function(f) { return f.filename === filename; });
  if (!file) return;

  // HTML / Markdown：新标签页打开，但走沙箱查看页 viewer.html
  // （iframe 带 sandbox 且无 allow-same-origin → 报告脚本运行在「不透明源」，读不到同域 localStorage/cookie，杜绝 XSS）
  var ext = fileExt(filename);
  if (ext === 'md' || ext === 'html' || ext === 'htm') {
    var vurl = 'viewer.html?f=' + encodeURIComponent(filename) + '&title=' + encodeURIComponent(title || filename);
    window.open(vurl, '_blank');
    renderSidebar();
    return;
  }

  // 其余所有格式（PDF / Word / Excel / PPT / 图片等）统一在新标签页打开
  if (file.isUploaded && file.data) {
    // Open from base64
    var parts = file.data.split(',');
    var mime = parts[0].match(/:(.*?);/)[1];
    var bstr = atob(parts[1]);
    var n = bstr.length;
    var u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    var blob = new Blob([u8], {type: mime});
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  } else {
    var url = 'reports/' + encodeURIComponent(filename);
    window.open(url, '_blank');
  }
  renderSidebar();
}

// 向服务端发起登录，成功后返回签名令牌（不含明文密码），本地仅保存令牌。
function doLogin(pwd) {
  return fetch(UPLOAD_API, {

    headers: { 'Content-Type': 'application/json' },

  }).then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); });
}

// 上传分类下拉选项: 一级分类只作 optgroup 标签(避免与子项重复), 二级只用简短名; 末尾提供「新建分类」
function uploadCatOptions(cur) {
  var opts = '<option value="" disabled'+(cur?'':' selected')+'>— 请选择分类文件夹 —</option>';
  getTree().forEach(function(cat) {
    if (cat.children) {
      opts += '<optgroup label="'+esc(cat.name)+'">';
      cat.children.forEach(function(ch) { opts += '<option value="'+ch.id+'"'+(cur===ch.id?' selected':'')+'>'+esc(ch.name)+'</option>'; });
      opts += '</optgroup>';
    } else {
      opts += '<option value="'+cat.id+'"'+(cur===cat.id?' selected':'')+'>'+esc(cat.name)+'</option>';
    }
  });
  opts += '<option value="__new_cat__">＋ 新建分类…</option>';
  return opts;
}

// 自定义下拉显示层: 根据 select.value 渲染完整路径(一级 - 二级)或占位
function updateCatSelectDisplay(sel, displayId) {
  var disp = document.getElementById(displayId);
  if (!disp) return;
  var v = sel.value;
  var label = '';
  if (!v || v === '__new_cat__') {
    disp.textContent = '— 请选择分类文件夹 —';
    disp.classList.add('placeholder');
    return;
  }
  disp.classList.remove('placeholder');
  // 找一级分类(若 v 是二级)
  var tree = getTree();
  for (var i=0;i<tree.length;i++) {
    var cat = tree[i];
    if (cat.id === v) { label = cat.name; break; }
    if (cat.children) {
      var ch = cat.children.find(function(c){ return c.id===v; });
      if (ch) { label = cat.name + ' - ' + ch.name; break; }
    }
  }
  disp.textContent = label || v;
}

function handleUpload(fileList) {
  var cat = document.getElementById('uploadCat').value;
  var result = document.getElementById('uploadResult');

  // 强制先选分类: 没选则拦截上传并提示
  if (!cat || cat === '__new_cat__') {
    result.innerHTML = '<p style="color:var(--danger)">⚠ 请先在上方「上传到分类」中选择一个文件夹，否则无法上传。</p>';
    toast('请先选择分类文件夹', false);
    return;
  }

  // 接受所有文件类型(不再按后缀过滤)。兜底:过滤掉空名文件。
  var files = Array.from(fileList).filter(function(f) {
    return f && f.name && f.name.length > 0;
  });
  var bad = [];

  if (files.length === 0) {
    result.innerHTML = '<p style="color:var(--danger)">没有选择任何文件</p>';
    return;
  }
  if (!UPLOAD_API) {
    result.innerHTML = '<p style="color:var(--danger)">上传功能未配置：缺少服务端地址（UPLOAD_API）</p>';
    return;
  }
  if (!S.adminToken) {
    result.innerHTML = '<p style="color:var(--danger)">未登录或登录已过期，请先在右上角登录后台</p>';
    return;
  }

  // 客户端大小前置检查：避免大文件触发 API 网关/云函数超时，导致 cryptic 的 Failed to fetch
  // (腾讯云 API 网关默认请求体约 6MB、云函数默认超时 3s；base64 会膨胀 33%，故保守阈值 4MB)
  var MAX_CLIENT_BYTES = 4 * 1024 * 1024;
  var tooBig = files.filter(function (f) { return f.size > MAX_CLIENT_BYTES; });
  if (tooBig.length) {
    var names = tooBig.map(function (f) {
      return esc(f.name) + ' (' + (f.size / 1024 / 1024).toFixed(1) + 'MB)';
    }).join('、');
    result.innerHTML = '<p style="color:var(--danger)">⚠ 以下文件过大，当前服务器配置无法接收（约 4MB 以内）：<br>' + names + '</p>'
      + '<p style="font-size:12px;color:var(--muted);margin-top:6px">处理办法：① 压缩/拆分该文件后重试；② 或联系管理员在腾讯云控制台调高「API 网关请求体大小」与「云函数超时时间」。</p>';
    return;
  }

  result.innerHTML = '<p style="color:var(--muted)">正在上传 ' + files.length + ' 个文件到服务器...</p>';
  var done = 0, ok = 0, fail = [];
  var uploadedEntries = []; // 收集本次成功上传的文件元数据, 用于本地兜底(即使 manifest 读取失败也能立即/刷新后可见)

  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var dataUrl = e.target.result;
      var base64 = dataUrl.split(',')[1] || '';
      fetch(UPLOAD_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': S.adminToken },
        body: JSON.stringify({ op: 'upload', filename: file.name, content: base64, category: cat })
      })
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
      .then(function(resp) {
        done++;
        if (resp.ok) {
          ok++;
          uploadedEntries.push({
            name: file.name,
            title: file.name.replace(/\.[^.]+$/, ''),
            size: file.size,
            mtime: Math.floor(Date.now() / 1000),
            category: cat
          });
        } else fail.push(file.name + ' (' + (resp.j.error || '失败') + ')');
        if (done === files.length) finishUpload(result, ok, fail, bad, uploadedEntries);
      })
      .catch(function(e) {
        done++;
        var msg = (e && e.message) ? e.message : '无法连接服务端';
        var hint = (e && (e.name === 'TimeoutError' || (e.message && /timeout/i.test(e.message))))
          ? '（疑似文件过大导致服务端处理超时）'
          : '（疑似文件过大触及网关限额，或网络不稳定）';
        fail.push(file.name + ' (网络错误：' + msg + hint + ')');
        if (done === files.length) finishUpload(result, ok, fail, bad, uploadedEntries);
      });
    };
    reader.readAsDataURL(file);
  });
}

function finishUpload(result, ok, fail, bad, uploadedEntries) {
  var html = '';
  if (ok > 0) html += '<p style="color:var(--accent)">✓ 成功上传 ' + ok + ' 个文件到服务器</p>';
  fail.forEach(function(n) { html += '<p style="color:var(--danger)">✗ ' + esc(n) + '</p>'; });
  bad.forEach(function(f) { html += '<p style="color:var(--warning)">⚠ ' + esc(f.name) + ' - 不支持的格式</p>'; });
  html += '<p style="font-size:12px;color:var(--muted);margin-top:8px">文件已保存到 GitHub 仓库，列表将立即刷新。</p>';
  result.innerHTML = html;
  // 本地兜底: 把本次成功上传写入 localStorage, 即使 manifest 读取失败(如 raw 被墙), 当前浏览器也能立即显示并在刷新后保留
  if (uploadedEntries && uploadedEntries.length) {
    var names = {};
    (S.uploaded || []).forEach(function(u) { names[u.name] = true; });
    uploadedEntries.forEach(function(u) { if (!names[u.name]) { S.uploaded.push(u); names[u.name] = true; } });
    Save();
  }
  renderSidebar();
  toast('上传完成');
  // 立即重新拉取 manifest(优先 raw, 失败经 SCF 中继), 上传的文件立刻可见
  refreshManifest(function() { renderSidebar(); renderMain(); });
}

// 文件管理：合并「在线」与「已删除」到一个列表，带筛选标签 + 已删除状态标注。
// 物理仍走 trash/（不公开），公开首页/侧栏只读 manifest 不受影响。
var ADMIN_FILES = { active: [], deleted: [] };
var adminFilesFilter = 'all'; // all | online | deleted

function renderAdminFiles() {
  var c = document.getElementById('adminContent');
  c.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:8px 0">正在加载文件…</p>';
  // 在线文件来自本地(manifest+兜底)；已删除来自回收站(listtrash)
  adminApi('listtrash', {}).then(function(resp) {
    ADMIN_FILES.active = getAllFiles();
    ADMIN_FILES.deleted = (resp.ok && resp.j && resp.j.ok) ? (resp.j.items || []) : [];
    paintAdminFiles();
  }).catch(function() {
    ADMIN_FILES.active = getAllFiles();
    ADMIN_FILES.deleted = [];
    paintAdminFiles();
  });
}

function paintAdminFiles() {
  var c = document.getElementById('adminContent');
  if (!c) return;
  var active = ADMIN_FILES.active || [];
  var deleted = ADMIN_FILES.deleted || [];
  var filter = adminFilesFilter;

  var tabs = [
    { key: 'all', label: '全部', count: active.length + deleted.length },
    { key: 'online', label: '在线', count: active.length },
    { key: 'deleted', label: '已删除', count: deleted.length }
  ];
  var tabHtml = tabs.map(function(t) {
    var on = filter === t.key;
    return '<div class="af-filter' + (on ? ' active' : '') + '" onclick="setAdminFilesFilter(\'' + t.key + '\')">' + t.label + ' <span class="af-count">' + t.count + '</span></div>';
  }).join('');

  var bar = '<div class="af-bar">' +
    '<div class="af-filters">' + tabHtml + '</div>' +
    (deleted.length ? '<button class="btn btn-sm btn-danger" onclick="purgeAllTrash()"><i class="fas fa-trash"></i> 清空回收站</button>' : '') +
    '</div>';

  var rows = '';
  if (filter !== 'deleted') {
    active.forEach(function(f) {
      var cat = getFileCat(f.filename);

function slugifyCat(s) {
  return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// ID 留空且名称无法转英文(如纯中文)时自动生成合法 ID: 优先取名称里的英文/数字部分作前缀, 否则用 c-<随机后缀>
function autoCatId(name) {
  var ascii = String(name || '').replace(/[\u4e00-\u9fa5]/g, ' ');
  var prefix = slugifyCat(ascii) || 'c';
  return prefix + '-' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
}

// 生成唯一合法分类ID: 名称能转英文用 slug, 否则(如纯中文)用 autoCatId; 杜绝 cat_<时间戳> 这类孤儿 id
function makeCatId(name) {
  var id = slugifyCat(name);
  if (!id) id = autoCatId(name);
  return id;
}

function addCategory() {
  var name = document.getElementById('catNameInput').value.trim();
  if (!name) { toast('请输入分类名称'); return; }
  // ID 完全自动生成: 名称能转英文用 slug, 否则(如纯中文)用 autoCatId; 杜绝 cat_<时间戳> 这类孤儿 id
  var id = makeCatId(name);
  // 重复校验
  var allIds = [];
  getTree().forEach(function(c){ allIds.push(c.id); if (c.children) c.children.forEach(function(ch){ allIds.push(ch.id); }); });
  if (allIds.indexOf(id) >= 0) { toast('分类ID已存在：' + id); return; }
  var parent = document.getElementById('catParentInput').value;
  S.customCats.push({id:id, name:name, icon:'fas fa-folder', parentId:parent||null, updatedAt:Date.now()});
  Save(); closeModal(); renderAdminCats(); renderSidebar();
  if (S.adminToken) {
    toast('分类已创建：' + name + ' (' + id + ')');
  } else {
    toast('分类已创建（仅本机可见，登录后台后会同步到云端）：' + name, false);
  }
}

function editCategoryModal(catId) {
  // 先在顶级分类中查找; 找不到再查二级分类(children) —— 二级分类不在顶级列表, 原逻辑提前 return 导致编辑没反应
  var cat = getTree().find(function(c){return c.id===catId});
  if (!cat) {
    getTree().forEach(function(c) {
      if (c.children) {
        var ch = c.children.find(function(ch){return ch.id===catId});
        if (ch) cat = ch;
      }
    });
  }
  if (!cat) return;

  showModal('编辑分类', `
    <input type="text" id="editCatName" value="${esc(cat.name)}">
    <input type="text" id="editCatIcon" value="${cat.icon||'fas fa-folder'}" placeholder="Font Awesome 图标类名">
  `, [
    {text:'取消', cls:'btn-ghost', action:'closeModal()'},
    {text:'保存', cls:'btn-primary', action:'saveCategoryEdit(\''+catId+'\')'}

}

function saveCategoryEdit(catId) {
  var name = document.getElementById('editCatName').value.trim();
  var icon = document.getElementById('editCatIcon').value.trim();
  if (!name) { toast('请输入名称'); return; }
  // Find and update in customCats or TREE
  var custom = S.customCats.find(function(c){return c.id===catId});
  if (custom) {
    custom.name = name; custom.icon = icon; custom.updatedAt = Date.now();
  } else {
    // 内置分类: 以同 id 的 override 存入 customCats(含父分类 id), getTree 会用其覆盖内置分类的名字/图标
    var parentId = null;
    getTree().forEach(function(c) {
      if (c.children && c.children.find(function(ch){ return ch.id === catId; })) parentId = c.id;
    });
    S.customCats.push({id:catId, name:name, icon:icon||'fas fa-folder', parentId:parentId, updatedAt:Date.now()});
  }
  Save(); closeModal(); renderAdminCats(); renderSidebar();
  toast('分类已更新');
}

function deleteCategory(catId) {
  var tree = getTree();
  var cat = null;
  var childIds = [];
  tree.forEach(function(c){
    if (c.id === catId) { cat = c; if (c.children) c.children.forEach(function(ch){ childIds.push(ch.id); }); }
  });
  var delName = cat ? cat.name : catId;
  // 检查该分类(一级含其下所有二级)是否有文件: 有文件则禁止删除, 提示先移动
  var checkIds = [catId].concat(childIds);
  var files = getAllFiles().filter(function(f){ return checkIds.indexOf(getFileCat(f.filename)) >= 0; });
  if (files.length > 0) {
    toast('「' + delName + '」下还有 ' + files.length + ' 个文件，请先将这些文件移动到其他分类再删除', false);
    return;
  }
  if (!confirm('确定删除分类「' + delName + '」？' + (childIds.length ? '（将同时删除其下 ' + childIds.length + ' 个二级分类）' : ''))) return;
  // 自定义分类: 从 customCats 移除(含同名 override); 内置分类: 记录到 deletedCats 隐藏
  var delIds = [catId].concat(childIds);
  S.customCats = S.customCats.filter(function(c){ return delIds.indexOf(c.id) < 0; });
  if (!S.deletedCats) S.deletedCats = [];
  delIds.forEach(function(id){ if (S.deletedCats.indexOf(id) < 0) S.deletedCats.push(id); });
  // 清理排序记录与文件归类(该分类文件已确认不存在, 仅清理残留映射)
  S.catOrder = (S.catOrder || []).filter(function(id){ return delIds.indexOf(id) < 0; });
  S.catOrderUpdatedAt = Date.now();
  Object.keys(S.fileCats).forEach(function(fn) {
    if (delIds.indexOf(S.fileCats[fn]) >= 0) delete S.fileCats[fn];
  });
  Save(); renderAdminCats(); renderSidebar(); renderMain();
  toast('分类已删除');
}

function moveFile(filename) {
  var cat = document.getElementById('moveCatSelect').value;
  if (!cat) { toast('请先选择目标分类'); return; }
  // 校验目标分类真实存在(防止写入孤儿 id)
  var exists = false;
  getTree().forEach(function(c){ if (c.id === cat) exists = true; if (c.children) c.children.forEach(function(ch){ if (ch.id === cat) exists = true; }); });
  if (!exists) { toast('目标分类无效，请重新选择'); return; }
  // 1) 本地立即生效(覆盖层), 保证界面即时反馈
  S.fileCats[filename] = cat;
  Save(); closeModal(); renderAdminFiles(); renderMain(); renderSidebar();
  toast('已移动到: ' + catName(cat));
  // 2) 持久化到云端(管理员令牌下写 manifest.category, 权威源; 其他登录用户/刷新都一致)
  if (!S.adminToken) { toast('未登录，仅本机生效（请先在后台登录再移动以同步云端）'); return; }
  adminApi('move', { filename: filename, targetCat: cat }).then(function (resp) {
    if (!resp.ok || !resp.j || !resp.j.ok) {
      toast('云端同步失败，仅本机生效：' + ((resp.j && resp.j.error) || '未知错误'));
    } else {
      // 云端已更新 manifest.category, 重拉使 FILES 权威分类生效(主页/侧栏计数等)
      refreshManifest(function () { renderAdminFiles(); renderMain(); renderSidebar(); });
      toast('已移动到「' + catName(cat) + '」并已同步到云端');
    }
  }).catch(function () { toast('云端同步失败，仅本机生效：网络错误'); });
}

  S.fileTags[filename].push(tag);
  if (S.allTags.indexOf(tag) < 0) S.allTags.push(tag);
  Save();
  document.getElementById('newFileTag').value = '';
  editTagsModal(filename);

  S.fileTags[filename] = (S.fileTags[filename]||[]).filter(function(t){return t!==tag});
  Save(); editTagsModal(filename); renderSidebar(); renderMain();
}

function deleteFile(filename) {
  if (!confirm('确定删除文件「'+filename+'」？\n删除后将在「文件管理」中标注为「已删除」，可随时恢复。')) return;
  if (!S.adminToken) { toast('请先登录后台'); return; }
  adminApi('delete', { filename: filename }).then(function(resp) {
    if (!resp.ok || !resp.j.ok) { toast('删除失败：' + (resp.j.error || '未知错误')); return; }
    // 清除本地跟踪, 立即从界面消失
    S.uploaded = S.uploaded.filter(function(f){return f.name !== filename});
    S.favorites = S.favorites.filter(function(f){return f !== filename});
    S.recent = S.recent.filter(function(f){return f !== filename});
    delete S.fileTags[filename];
    delete S.fileCats[filename];
    Save();
    // 同步即时从首页/列表移除(不依赖异步拉取), 之后 refreshManifest 用权威数据再渲染一次
    FILES = FILES.filter(function(f){ return f.filename !== filename; });
    renderMain();
    refreshManifest(function() { renderAdminFiles(); renderSidebar(); renderMain(); });
    toast('已删除，可在「文件管理 - 已删除」中恢复');
  }).catch(function() {
    toast('删除失败：网络错误，请确认函数 URL 可达');
  });
}

// 统一的后台 API 调用(携带管理员令牌)
function adminApi(op, body) {
  return fetch(UPLOAD_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': S.adminToken },
    body: JSON.stringify(Object.assign({ op: op }, body || {}))
  }).then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); });
}

// 重新拉取 manifest(优先 raw, 失败经 SCF 中继), 用于上传/删除/恢复后即时刷新列表
function refreshManifest(cb) {
  fetch(rawManifestUrl() + '?t=' + Date.now()).then(function(r) { return r.json(); }).then(function(d) {
    if (Array.isArray(d) && d.length) { FILES = d; if (cb) cb(); return; }
    fetchManifestViaSCF(function(m) { if (m) FILES = m; if (cb) cb(); });
  }).catch(function() {
    fetchManifestViaSCF(function(m) { if (m) FILES = m; if (cb) cb(); });
  });
}

// 经腾讯云 SCF 中继读取 manifest(国内稳定), 回调传入数组或 null
function fetchManifestViaSCF(cb) {
  try {
    fetch(UPLOAD_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'getmanifest' }) })
      .then(function(r) { return r.json(); }).then(function(j) {
        if (j && j.ok && Array.isArray(j.data)) cb(j.data); else cb(null);
      }).catch(function() { cb(null); });
  } catch (e) { cb(null); }
}
// 经 SCF 中继读取 meta.json, 回调传入对象或 null
function fetchMetaViaSCF(cb) {
  try {
    fetch(UPLOAD_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'getmeta' }) })
      .then(function(r) { return r.json(); }).then(function(j) {
        if (j && j.ok && j.data) cb(j.data); else cb(null);
      }).catch(function() { cb(null); });
  } catch (e) { cb(null); }
}

function renderAdminTrash() {
  var c = document.getElementById('adminContent');
  c.innerHTML = '<div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<span style="font-size:13px;color:var(--muted)">已删除的文件会暂存在这里，可恢复或彻底清除（回收站不对外公开）。</span>' +
    '<button class="btn btn-sm btn-danger" onclick="purgeAllTrash()"><i class="fas fa-trash"></i> 清空回收站</button></div>' +
    '<div id="trashList">正在加载回收站…</div>';
  adminApi('listtrash', {}).then(function(resp) {
    var box = document.getElementById('trashList');
    if (!box) return;
    if (!resp.ok || !resp.j.ok) { box.innerHTML = '<p style="color:var(--danger)">加载失败：' + (resp.j.error || '未知错误') + '</p>'; return; }
    var items = resp.j.items || [];
    if (items.length === 0) { box.innerHTML = '<p style="color:var(--muted)">回收站为空。</p>'; return; }
    var html = '<table class="admin-table"><thead><tr><th>原文件名</th><th>删除时间</th><th>操作</th></tr></thead><tbody>';
    items.forEach(function(it) {
      var dt = it.deletedAt ? new Date(it.deletedAt).toLocaleString('zh-CN') : '';
      html += '<tr>';
      html += '<td style="max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.originalFilename) + '</td>';
      html += '<td>' + dt + '</td>';
      html += '<td><div class="actions">';
      html += '<button class="act-btn" title="恢复" onclick="restoreFile(\'' + esc(it.entryId) + '\')"><i class="fas fa-undo"></i></button>';
      html += '<button class="act-btn danger" title="彻底删除" onclick="purgeFile(\'' + esc(it.entryId) + '\')"><i class="fas fa-times"></i></button>';
      html += '</div></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
  }).catch(function() {
    var box = document.getElementById('trashList');
    if (box) box.innerHTML = '<p style="color:var(--danger)">加载失败：网络错误，请确认函数 URL 可达</p>';
  });
}

function restoreFile(entryId) {
  if (!confirm('确定恢复该文件？将重新出现在文件列表中。')) return;
  adminApi('restore', { entryId: entryId }).then(function(resp) {
    if (!resp.ok || !resp.j.ok) { toast('恢复失败：' + (resp.j.error || '未知错误')); return; }
    refreshManifest(function() { renderAdminFiles(); renderSidebar(); renderMain(); });
    toast('已恢复');
  }).catch(function() { toast('恢复失败：网络错误'); });
}

function purgeFile(entryId) {
  if (!confirm('彻底删除后无法恢复，确定？')) return;
  adminApi('purge', { entryId: entryId }).then(function(resp) {
    if (!resp.ok || !resp.j.ok) { toast('删除失败：' + (resp.j.error || '未知错误')); return; }
    renderAdminFiles();
    toast('已彻底删除');
  }).catch(function() { toast('删除失败：网络错误'); });
}

function purgeAllTrash() {
  if (!confirm('将清空回收站中所有文件，且无法恢复，确定？')) return;
  adminApi('purgeall', {}).then(function(resp) {
    if (!resp.ok || !resp.j.ok) { toast('清空失败：' + (resp.j.error || '未知错误')); return; }
    renderAdminFiles();
    toast('回收站已清空');
  }).catch(function() { toast('清空失败：网络错误'); });
}

function addTag() {
  try {
    var tag = document.getElementById('newTagInput').value.trim();
    if (!tag) { toast('请输入标签名称'); return; }
    if (S.allTags.indexOf(tag) >= 0) { toast('标签已存在'); return; }
    S.allTags.push(tag);
    // 从已删除列表中移除(重新添加先前删除过的标签)
    S.deletedTags = (S.deletedTags || []).filter(function(t) { return t !== tag; });
    Save();
    renderAdminTags(); renderSidebar();
    toast('标签已添加');
  } catch(e) { toast('添加标签出错: ' + e.message); console.error('[addTag]', e); }
}

function removeTag(tag) {
  S.allTags = S.allTags.filter(function(t){return t!==tag});
  // 记录已删除标签, 防止刷新时从云端复活
  if ((S.deletedTags || []).indexOf(tag) < 0) {
    S.deletedTags = (S.deletedTags || []).concat([tag]);
  }
  Object.keys(S.fileTags).forEach(function(fn) {
    S.fileTags[fn] = (S.fileTags[fn] || []).filter(function(t){return t!==tag});
  });
  Save(); renderAdminTags(); renderSidebar();
  toast('标签已移除');
}

// ===== MODAL =====
function showModal(title, body, footer) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  var f = document.getElementById('modalFooter');
  f.innerHTML = '';
  footer.forEach(function(btn) {
    f.innerHTML += '<button class="btn btn-sm '+btn.cls+'" onclick="'+btn.action+'">'+btn.text+'</button>';
  });
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ===== KEYBOARD =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('adminLogin').classList.remove('show');
  }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ===== VIEWER GATE（查看密码：防止外人直接访问全部文件）=====
function isViewUnlocked() {
  try {
    if (sessionStorage.getItem('kb_view_unlocked') === '1') return true;
    if (localStorage.getItem('kb_view_unlocked') === '1') return true;
  } catch(e) {}
  return false;
}
S.viewUnlocked = isViewUnlocked();
S.isAdmin = !!S.adminToken; // 记住本设备时令牌仍在，视为已登录（上传若 401 会提示重新登录）
loadMeta(); // 启动即从云端加载分类/标签(云端为权威源, 换设备/清缓存不丢)

function showViewerLock() {
  var lock = document.getElementById('viewerLock');
  if (!lock) return;
  lock.classList.add('show');
  var layout = document.querySelector('.layout');
  if (layout) layout.style.display = 'none';
  setTimeout(function(){ var i=document.getElementById('viewPwdInput'); if(i) i.focus(); }, 50);
}
function hideViewerLock() {
  var lock = document.getElementById('viewerLock');
  if (lock) lock.classList.remove('show');
  var layout = document.querySelector('.layout');
  if (layout) layout.style.display = '';
}
function tryUnlock(pwd, remember) {
  doLogin(pwd).then(function(resp) {
    if (resp.ok && resp.j.token) {
      S.adminToken = resp.j.token;
      S.viewUnlocked = true;
      S.isAdmin = true; // 查看密码=管理密码，解锁后后台亦可直接进入
      loadMeta(); // 解锁后刷新云端分类/标签
      try {
        sessionStorage.setItem('kb_admin_token', S.adminToken);
        sessionStorage.setItem('kb_view_unlocked','1');
        if (remember) { localStorage.setItem('kb_admin_token', S.adminToken); localStorage.setItem('kb_view_unlocked','1'); }
      } catch(e) {}
      document.getElementById('viewErr').textContent = '';
      document.getElementById('viewPwdInput').value = '';
      hideViewerLock();
      renderSidebar(); renderMain();
    } else {
      document.getElementById('viewErr').textContent = (resp.j && resp.j.error) || '密码错误，请重试';
    }
  }).catch(function(e) {
    document.getElementById('viewErr').textContent = '无法连接服务端，请稍后重试';
  });
}

document.getElementById('viewUnlockBtn').addEventListener('click', function() {
  tryUnlock(document.getElementById('viewPwdInput').value, document.getElementById('viewRemember').checked);
});
document.getElementById('viewPwdInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('viewUnlockBtn').click();
});

// ===== INIT =====
if (S.viewUnlocked) { renderSidebar(); renderMain(); }
else { showViewerLock(); }

</script>
