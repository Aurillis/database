<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报告预览</title>
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;background:#f5f6f8}
  .vh{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1a1a2e;color:#fff;flex:0 0 auto}
  .vh-back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .vh-back:hover{opacity:.85}
  .vh-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vh-dl{color:#fff;text-decoration:none;font-size:13px;font-weight:600;background:var(--accent,#4f7cff);padding:5px 12px;border-radius:5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .vh-dl:hover{opacity:.9}
  .vh-open{color:#fff;text-decoration:none;font-size:13px;font-weight:600;background:#2f9e44;padding:5px 12px;border-radius:5px;white-space:nowrap;display:none;align-items:center;gap:6px}
  .vh-open:hover{opacity:.9}
  .vh-note{display:none;padding:8px 16px;background:#fff8e1;color:#8a6d00;font-size:12.5px;border-bottom:1px solid #ffe59e;align-items:center;gap:8px}
  .vh-body{flex:1;position:relative;overflow:hidden;background:#fff}
  .vh-body iframe{width:100%;height:100%;border:none;background:#fff}
  .vh-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#646a73;background:#fff;z-index:5}
  .vh-msg{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#646a73;padding:40px;text-align:center}
  .vh-msg i{font-size:40px;color:#d0d3d9}
  .vh-msg.err i{color:#e5534b}
  .vh-msg .vh-actions{margin-top:14px;display:flex;gap:10px;justify-content:center}
  .vh-msg .vh-actions a{position:static}
</style>
</head>
<body>
  <header class="vh">
    <a class="vh-back" href="javascript:void(0)" onclick="closeViewer()"><i class="fas fa-times"></i> 关闭</a>
    <span class="vh-title" id="vt">报告预览</span>
    <a class="vh-dl" id="dl" href="#" download><i class="fas fa-download"></i> 下载原文件</a>
    <a class="vh-open" id="openStandalone" href="#" target="_blank"><i class="fas fa-external-link-alt"></i> 直接打开（可保存勾选）</a>
  </header>
  <div class="vh-note" id="note"></div>
  <div class="vh-body" id="body">
    <iframe id="frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    <div class="vh-loading" id="loading" style="display:none"><i class="fas fa-spinner fa-spin"></i> 正在加载看板…</div>
  </div>

  <script src="vendor/marked/marked.min.js"></script>
  <script>
  // 「关闭」而非「返回」：对外链收件人, 返回会跳到被密码锁住的门户(死胡同)。
  // 优先 window.close()(对脚本打开的窗口有效), 否则回退历史; 都没有则停留本页。
  function closeViewer() {
    if (window.opener) { try { window.close(); } catch (e) {} return; }
    if (history.length > 1) { history.back(); return; }
    try { window.close(); } catch (e) {}
  }
  </script>
  <script>
  (function() {
    var params = new URLSearchParams(location.search);
    var f = params.get('f');
    var title = params.get('title') || f || '报告预览';
    document.getElementById('vt').textContent = title;
    document.title = title;
    var frame = document.getElementById('frame');
    function rawReportUrl(name) {
      // 直读 raw.githubusercontent.com: 永远最新, 无需等 Pages 重新构建(否则新上传文件要 1~2 分钟后才打得开)
      try {
        var u = new URL(location.href);
        if (u.hostname.endsWith('.github.io')) {
          var parts = u.pathname.split('/').filter(function (p) { return p; });
          if (parts.length >= 1) {
            var user = u.hostname.split('.')[0];
            var repo = parts[0];
            return 'https://raw.githubusercontent.com/' + user + '/' + repo + '/main/reports/' + encodeURIComponent(name);
          }
        }
      } catch (e) {}
      return 'reports/' + encodeURIComponent(name);
    }
    var rawUrl = f ? rawReportUrl(f) : '';
    document.getElementById('dl').href = 'reports/' + encodeURIComponent(f); // 下载走同源 Pages(行为正常), 预览走 raw(即时)

    // 看板「打印」由父页面接管：打开洁净新窗口打印看板(含实时勾选/填写)，避免沙箱 iframe 打印被裁剪、并带上查看器外壳。
    window.__kbPrint = function () {
      var fw = frame;
      var doc;
      try { doc = fw.contentWindow && fw.contentWindow.document; } catch (e) { return; }
      if (!doc) return;
      // 把实时表单值同步进属性，保证序列化(outerHTML)准确反映当前勾选/填写
      doc.querySelectorAll('input,textarea,select').forEach(function (el) {
        if (el.type === 'checkbox' || el.type === 'radio') {
          if (el.checked) el.setAttribute('checked', 'checked'); else el.removeAttribute('checked');
        } else if (el.tagName !== 'TEXTAREA') {
          el.setAttribute('value', el.value);
        }
      });
      doc.querySelectorAll('textarea').forEach(function (el) { el.textContent = el.value; });
      doc.querySelectorAll('option').forEach(function (o) { if (o.selected) o.setAttribute('selected', 'selected'); else o.removeAttribute('selected'); });
      var html = doc.documentElement.outerHTML;
      // 去掉注入的同步桥脚本(含 KB_API)，避免打印窗口再触发云同步请求
      html = html.replace(/<script[\s\S]*?KB_API[\s\S]*?<\/script>/g, '');
      var w = window.open('', '_blank');
      if (!w) { alert('打印窗口被浏览器拦截，请允许弹出窗口后重试'); return; }
      w.document.open();
      w.document.write('<!DOCTYPE html>' + html);
      w.document.close();
      w.onload = function () { try { w.focus(); w.print(); } catch (e) {} };
      w.onafterprint = function () { try { w.close(); } catch (e) {} };
    };

    function showMsg(text, isErr) {
      var body = document.getElementById('body');
      body.innerHTML = '<div class="vh-msg' + (isErr ? ' err' : '') + '">' +
        '<i class="fas ' + (isErr ? 'fa-exclamation-triangle' : 'fa-spinner fa-spin') + '"></i>' +
        '<div>' + text + '</div></div>';
    }

    // 加载失败时的可操作错误态：显示真实错误 + 重试 + 直接打开原文件(绕过查看页)
    function showError(text, rawUrl, err) {
      var body = document.getElementById('body');
      body.innerHTML = '';
      var msg = document.createElement('div');
      msg.className = 'vh-msg err';
      var icon = document.createElement('i'); icon.className = 'fas fa-exclamation-triangle'; msg.appendChild(icon);
      var t = document.createElement('div'); t.textContent = text; msg.appendChild(t);
      if (err && err.message) {
        var e = document.createElement('div');
        e.style.cssText = 'font-size:12px;color:#999;margin-top:6px;word-break:break-all';
        e.textContent = String(err.message);
        msg.appendChild(e);
      }
      var actions = document.createElement('div');
      actions.className = 'vh-actions';
      var retry = document.createElement('a');
      retry.className = 'vh-dl'; retry.href = 'javascript:location.reload()';
      retry.innerHTML = '<i class="fas fa-redo"></i> 重试';
      var open = document.createElement('a');
      open.className = 'vh-dl'; open.href = rawUrl; open.target = '_blank'; open.style.background = '#2f9e44';
      open.innerHTML = '<i class="fas fa-external-link-alt"></i> 直接打开原文件';
      actions.appendChild(retry); actions.appendChild(open);
      msg.appendChild(actions);
      body.appendChild(msg);
    }

    var KB_SCF_API = 'https://1461447139-m5rkq2fg8n.ap-guangzhou.tencentscf.com';

    // 看板同步桥回传的状态：仅在出错时提示（成功静默，不打扰）；用于排查「另一台电脑看不到进度」
    window.addEventListener('message', function (e) {
      if (!e.data || !e.data.__kbSync) return;
      var note = document.getElementById('note');
      if (!note) return;
      if (e.data.__kbSync === 'err') {
        note.style.display = 'flex';
        note.innerHTML = '<i class="fas fa-exclamation-circle"></i> 云端进度读取失败，已使用本机记录（如本机也无，则看板为空）。';
      } else if (e.data.__kbSync === 'expired') {
        note.style.display = 'flex';
        note.innerHTML = '<i class="fas fa-exclamation-circle"></i> 登录已过期，请回到主站重新登录后刷新本页，云端进度才会保存。';
      }
    });

    // 生成注入看板 <head> 的同步桥脚本：
    //   · 用「同步 XHR」直接读同源 state/<file>.json，并在看板 loadState() 之前写入 localStorage
    //     —— 决定性方案，彻底消除「异步拉取晚于 loadState」的竞态（这是另一台电脑看不到进度的根因）。
    //   · 拦截 localStorage.setItem：勾选/填写后自动经 SCF 写回云端（带去重，避免初始化渲染把云端覆盖成空）。
    //   · 打印由父页面接管(__kbPrint)。
    function buildStateShim(api, file, stateUrl) {
      // 看板云同步桥(健壮版)：
      //  · 读取：SCF 实时接口(主，保存即别人立即可见，不经 Pages 重建) + 同源 state 文件(备)
      //  · 写入：拦截 localStorage.setItem，防抖经 SCF op:state put 写回(内嵌 editKey，无需先登后台)
      //  · 保存失败在页面右下角弹提示(不再静默吞掉)
      //  · window.__KB_SYNC_INJECTED 防止与看板自带脚本重复安装
      var lines = [
        '(function(){',
        '  if (window.__KB_SYNC_INJECTED) return;',
        '  window.__KB_SYNC_INJECTED = true;',
        '  try {',
        "    var kbFile = (window.__KB_FILE) || location.pathname.split('/').pop();",
        "    if (!kbFile) return;",
        "    var base = location.href.split('/viewer.html')[0].split('/reports/')[0];",
        "    var KB_STATE = base + '/state/' + encodeURIComponent(kbFile) + '.json';",
        "    var KB_API = 'https://1461447139-m5rkq2fg8n.ap-guangzhou.tencentscf.com';",
        "    var KB_EDIT_KEY = 'kbSync_8f3a2c91d4e5';",
        "    function getTok(){ try { return (localStorage.getItem('kb_admin_token') || sessionStorage.getItem('kb_admin_token') || (window.parent && window.parent.localStorage && window.parent.localStorage.getItem('kb_admin_token')) || (window.parent && window.parent.sessionStorage && window.parent.sessionStorage.getItem('kb_admin_token')) || ''); } catch(e){ return ''; } }",
        "    function toast(msg, ok){ try { var d=document.getElementById('__kb_toast'); if(!d){ d=document.createElement('div'); d.id='__kb_toast'; d.style.cssText='position:fixed;right:12px;bottom:12px;z-index:2147483647;max-width:260px;padding:8px 12px;border-radius:8px;font:13px/1.5 system-ui,sans-serif;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:.96;'; document.body.appendChild(d); } d.textContent=msg; d.style.background=ok?'#0e7d72':'#c0392b'; d.style.display='block'; clearTimeout(d.__t); d.__t=setTimeout(function(){ if(d) d.style.display='none'; }, 2800); } catch(e){} }",
        "    function applyState(j){ try { if(!j||!j.data) return; var lts=parseInt(localStorage.getItem('__kbst_ts')||'0',10); if((j.ts||0)>lts){ for(var k in j.data){ if(j.data.hasOwnProperty(k)) localStorage.setItem(k,j.data[k]); } localStorage.setItem('__kbst_ts',String(j.ts||0)); toast('已同步云端最新进度', true); } } catch(e){} }",
        "    function readPages(){ try { var x=new XMLHttpRequest(); x.open('GET', KB_STATE+'?t='+Date.now(), false); x.send(); if(x.status===200){ try { applyState(JSON.parse(x.responseText)); } catch(e){} } } catch(e){} }",
        "    function readSCF(){ try { var x=new XMLHttpRequest(); x.open('POST', KB_API, true); x.setRequestHeader('Content-Type','application/json'); x.onload=function(){ if(x.status===200){ try { applyState(JSON.parse(x.responseText)); } catch(e){ readPages(); } } else { readPages(); } }; x.onerror=function(){ readPages(); }; x.send(JSON.stringify({op:'state',action:'get',filename:kbFile})); } catch(e){ readPages(); } }",
        '    readSCF();',
        "    var _set=Storage.prototype.setItem; var PREFIX='__kbst_'; var lastSent=''; var _inflight=false; var _pending=false;",
        "    function isOwn(k){ return !k || k.indexOf('kb_')===0 || (k && k.toLowerCase().indexOf('token')>=0) || k.indexOf(PREFIX)===0; }",
        "    function snap(){ var d={}; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(isOwn(k)) continue; d[k]=localStorage.getItem(k); } return d; }",
        "    function push(){ var data=snap(); var key=JSON.stringify(data); if(key===lastSent && !_inflight) return; if(_inflight){ _pending=true; lastSent=key; return; } lastSent=key; _inflight=true; var body=JSON.stringify({op:'state',action:'put',filename:kbFile,data:data,ts:Date.now(),editKey:KB_EDIT_KEY}); fetch(KB_API,{method:'POST',headers:{'Content-Type':'application/json'},body:body}).then(function(r){ if(r.ok){ toast('已自动保存到云端', true); } else { toast('云端保存失败('+r.status+')', false); } }).catch(function(){ toast('云端保存失败，请检查网络', false); }).finally(function(){ _inflight=false; if(_pending){ _pending=false; setTimeout(push, 0); } }); }",
        "    var _origPrint=window.print?window.print.bind(window):function(){};",
        "    try { window.print=function(){ if(window.parent && window.parent.__kbPrint){ window.parent.__kbPrint(); return; } _origPrint(); }; } catch(e){}",
        "    Storage.prototype.setItem=function(k,v){ _set.apply(this,arguments); if(isOwn(k)) return; setTimeout(function(){ push(); }, 800); };",
        '  } catch(e){}',
        '})();'
      ];
      return '<script>' + lines.join('\n') + '<\/script>';
    }

    // 在 <head> 起始处注入 <base>(让相对资源正确解析) 与同步桥脚本
    function injectHead(html, baseHref, shim) {
      var base = '<base href="' + baseHref + '">';
      var inject = base + shim;
      if (/<head[^>]*>/i.test(html)) return html.replace(/<head([^>]*)>/i, '<head$1>' + inject);
      if (/<html[^>]*>/i.test(html)) return html.replace(/<html([^>]*)>/i, '<html$1><head>' + inject + '</head>');
      return '<head>' + inject + '</head>' + html;
    }

    if (!f) { showMsg('缺少文件参数', true); return; }

    var ext = (f.split('.').pop() || '').toLowerCase();

    if (ext === 'md') {
      // Markdown：站内渲染为富文本，再放进沙箱 iframe（不透明源，无法读取同域 localStorage/cookie）
      fetch(rawUrl).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function(txt) {
        var body;
        if (window.marked && marked.parse) {
          try { body = marked.parse(txt); } catch(e) { body = '<pre>' + txt.replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) + '</pre>'; }
        } else {
          body = '<pre>' + txt.replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) + '</pre>';
        }
        var doc = MD_TMPL.replace('__BODY__', body);
        frame.removeAttribute('src');
        frame.srcdoc = doc;
      }).catch(function(err) { showError('加载失败，请重试或下载原文件', rawUrl, err); });
      return;
    }

    if (ext === 'html' || ext === 'htm') {
      // 看板类 HTML：
      // 用 fetch+srcdoc 加载（可在 <head> 注入同步桥）。
      // 勾选状态「共享」= 同域 state/<文件名>.json（由 SCF 写入仓库、GitHub Pages 同源托管）。
      //   · 读取：注入脚本在 iframe 内用「同步 XHR」直接读该文件，并在看板 loadState() 之前写入
      //          localStorage —— 决定性、无竞态；任何登录的人打开即见最新进度。
      //   · 写入：勾选/填写触发 localStorage.setItem 时被拦截，经 SCF op:'state' put 写回云端
      //          （唯一能把数据提交进仓库的通道；未登录则鉴权失败、不写，本地仍可用）。
      // 若看板内容 fetch 失败（网络/扩展/超时/404），退化为「浏览器原生直接导航」打开原文件，保证看板一定可见。
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-modals allow-downloads');
      var boardDir = new URL('reports/', location.href).href;
      // 同域共享状态文件的「绝对」地址（必须绝对，否则会被 iframe 内的 <base href=reports/> 带偏成 reports/state/... 而 404）
      var stateUrlAbs = new URL('state/' + encodeURIComponent(f) + '.json', location.href).href;
      // 把文件名告知看板自身携带的同步脚本（window.__KB_FILE），使其在 srcdoc / 直接打开 两种模式下都能先于 loadState 同步云端
      var preShim = '<script>window.__KB_FILE=' + JSON.stringify(f) + ';<\/script>';
      var loading = document.getElementById('loading');
      loading.style.display = 'flex';

      // 退化方案：直接用浏览器原生导航打开原文件（同源 localStorage 可用，本地勾选持久化照常工作）
      var fallback = function () {
        loading.style.display = 'none';
        frame.removeAttribute('srcdoc');
        // 退化为同源 Pages 打开(渲染为 HTML, 而非 raw 的 text/plain)
        frame.src = 'reports/' + encodeURIComponent(f);
        frame.onload = function () {
          try {
            var s = frame.contentDocument.createElement('script');
            s.textContent = preShim + buildStateShim(KB_SCF_API, f, stateUrlAbs);
            frame.contentDocument.head.appendChild(s);
          } catch (e) {}
        };
      };

      // 取看板内容（同源），带 8s 超时，失败则退化
      var bCtrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var bTimer = setTimeout(function () { if (bCtrl) bCtrl.abort(); }, 8000);
      fetch(rawUrl, bCtrl ? { signal: bCtrl.signal } : undefined)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (htmlText) {
          clearTimeout(bTimer);
          loading.style.display = 'none';
          // 同步桥内部用同步 XHR 读云端并先于 board loadState 写入，保证共享进度可见
          frame.srcdoc = injectHead(htmlText, boardDir, preShim + buildStateShim(KB_SCF_API, f, stateUrlAbs));
        })
        .catch(function (err) {
          // 看板内容 fetch 失败 —— 退化为原生打开，保证看板可见
          console.warn('[viewer] board fetch failed, fallback to direct navigation:', err);
          fallback();
        });
      return;
    }

    // 其它类型不应走查看页：直接引导下载
    showMsg('该格式不支持在线预览，请使用「下载原文件」', true);
  })();

  var MD_TMPL = [
    '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width,initial-scale=1">',
    '<style>',
    '*{box-sizing:border-box}',
    'body{margin:0;background:#fff;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.75;',
    '-webkit-font-smoothing:antialiased}',
    '.md{max-width:860px;margin:0 auto;padding:40px 28px 80px}',
    'h1,h2,h3,h4{color:#1f2329;font-weight:700;line-height:1.4;margin:28px 0 14px}',
    'h1{font-size:26px;padding-bottom:12px;border-bottom:1px solid #eceef1}',
    'h2{font-size:21px;padding-bottom:8px;border-bottom:1px solid #f0f1f3}',
    'h3{font-size:18px}h4{font-size:16px}',
    'p{margin:12px 0;color:#2b2f36}',
    'a{color:#2f6fed;text-decoration:none}a:hover{text-decoration:underline}',
    'strong{font-weight:700;color:#1f2329}',
    'em{color:#51565d}',
    'ul,ol{padding-left:24px;margin:12px 0}',
    'li{margin:6px 0}',
    'blockquote{margin:14px 0;padding:8px 16px;background:#f7f8fa;border-left:4px solid #d0d3d9;color:#646a73;border-radius:0 4px 4px 0}',
    'blockquote p{margin:4px 0;color:#646a73}',
    'code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;background:#f2f3f5;color:#d6336c;padding:2px 6px;border-radius:4px}',
    'pre{margin:14px 0;padding:16px;background:#1f2329;border-radius:8px;overflow:auto}',
    'pre code{background:transparent;color:#e6e6e6;padding:0;font-size:13px;line-height:1.6}',
    'table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}',
    'th,td{border:1px solid #e5e6eb;padding:8px 12px;text-align:left}',
    'th{background:#f7f8fa;font-weight:600;color:#1f2329}',
    'tr:nth-child(even) td{background:#fafbfc}',
    'img{max-width:100%;border-radius:6px;margin:8px 0}',
    'hr{border:none;border-top:1px solid #eceef1;margin:24px 0}',
    '</style></head><body><div class="md" id="c">__BODY__</div></body></html>'
  ].join('\n');
  </script>
</body>
</html>
