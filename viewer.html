<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报告预览</title>
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;background:#f5f6f8}
  .vh{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#1a1a2e;color:#fff;flex:0 0 auto}
  .vh-back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .vh-back:hover{opacity:.85}
  .vh-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vh-dl{color:#fff;text-decoration:none;font-size:13px;font-weight:600;background:var(--accent,#4f7cff);padding:5px 12px;border-radius:5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .vh-dl:hover{opacity:.9}
  .vh-open{color:#fff;text-decoration:none;font-size:13px;font-weight:600;background:#2f9e44;padding:5px 12px;border-radius:5px;white-space:nowrap;display:none;align-items:center;gap:6px}
  .vh-open:hover{opacity:.9}
  .vh-note{display:none;padding:8px 16px;background:#fff8e1;color:#8a6d00;font-size:12.5px;border-bottom:1px solid #ffe59e;align-items:center;gap:8px}
  .vh-body{flex:1;position:relative;overflow:hidden;background:#fff}
  .vh-body iframe{width:100%;height:100%;border:none;background:#fff}
  .vh-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#646a73;background:#fff;z-index:5}
  .vh-msg{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#646a73;padding:40px;text-align:center}
  .vh-msg i{font-size:40px;color:#d0d3d9}
  .vh-msg.err i{color:#e5534b}
  .vh-msg .vh-actions{margin-top:14px;display:flex;gap:10px;justify-content:center}
  .vh-msg .vh-actions a{position:static}
</style>
</head>
<body>
  <header class="vh">
    <a class="vh-back" href="javascript:void(0)" onclick="closeViewer()"><i class="fas fa-times"></i> 关闭</a>
    <span class="vh-title" id="vt">报告预览</span>
    <a class="vh-dl" id="dl" href="#" download><i class="fas fa-download"></i> 下载原文件</a>
    <a class="vh-open" id="openStandalone" href="#" target="_blank"><i class="fas fa-external-link-alt"></i> 直接打开（可保存勾选）</a>
  </header>
  <div class="vh-note" id="note"></div>
  <div class="vh-body" id="body">
    <iframe id="frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    <div class="vh-loading" id="loading" style="display:none"><i class="fas fa-spinner fa-spin"></i> 正在加载看板…</div>
  </div>

  <script src="vendor/marked/marked.min.js"></script>
  <script>
  // 「关闭」而非「返回」：对外链收件人, 返回会跳到被密码锁住的门户(死胡同)。
  // 优先 window.close()(对脚本打开的窗口有效), 否则回退历史; 都没有则停留本页。
  function closeViewer() {
    if (window.opener) { try { window.close(); } catch (e) {} return; }
    if (history.length > 1) { history.back(); return; }
    try { window.close(); } catch (e) {}
  }
  </script>
  <script>
  (function() {
    var params = new URLSearchParams(location.search);
    var f = params.get('f');
    var title = params.get('title') || f || '报告预览';
    document.getElementById('vt').textContent = title;
    document.title = title;
    var frame = document.getElementById('frame');
    var rawUrl = f ? 'reports/' + encodeURIComponent(f) : '';
    document.getElementById('dl').href = rawUrl;

    function showMsg(text, isErr) {
      var body = document.getElementById('body');
      body.innerHTML = '<div class="vh-msg' + (isErr ? ' err' : '') + '">' +
        '<i class="fas ' + (isErr ? 'fa-exclamation-triangle' : 'fa-spinner fa-spin') + '"></i>' +
        '<div>' + text + '</div></div>';
    }

    // 加载失败时的可操作错误态：显示真实错误 + 重试 + 直接打开原文件(绕过查看页)
    function showError(text, rawUrl, err) {
      var body = document.getElementById('body');
      body.innerHTML = '';
      var msg = document.createElement('div');
      msg.className = 'vh-msg err';
      var icon = document.createElement('i'); icon.className = 'fas fa-exclamation-triangle'; msg.appendChild(icon);
      var t = document.createElement('div'); t.textContent = text; msg.appendChild(t);
      if (err && err.message) {
        var e = document.createElement('div');
        e.style.cssText = 'font-size:12px;color:#999;margin-top:6px;word-break:break-all';
        e.textContent = String(err.message);
        msg.appendChild(e);
      }
      var actions = document.createElement('div');
      actions.className = 'vh-actions';
      var retry = document.createElement('a');
      retry.className = 'vh-dl'; retry.href = 'javascript:location.reload()';
      retry.innerHTML = '<i class="fas fa-redo"></i> 重试';
      var open = document.createElement('a');
      open.className = 'vh-dl'; open.href = rawUrl; open.target = '_blank'; open.style.background = '#2f9e44';
      open.innerHTML = '<i class="fas fa-external-link-alt"></i> 直接打开原文件';
      actions.appendChild(retry); actions.appendChild(open);
      msg.appendChild(actions);
      body.appendChild(msg);
    }

    var KB_SCF_API = 'https://1461447139-m5rkq2fg8n.ap-guangzhou.tencentscf.com';

    // 生成注入看板 <head> 的同步桥脚本：还原云端状态 + 拦截 localStorage 写入自动同步回云端
    function buildStateShim(api, file, cloud) {
      var cloudJson = JSON.stringify(cloud || null);
      var lines = [
        "var KB_API=" + JSON.stringify(api) + ";",
        "var KB_FILE=" + JSON.stringify(file) + ";",
        "var KB_CLOUD=" + cloudJson + ";",
        "(function(){",
        "  function getTok(){ try{ return (window.parent.localStorage.getItem('kb_admin_token')||window.parent.sessionStorage.getItem('kb_admin_token')||''); }catch(e){ return ''; } }",
        "  var _set=Storage.prototype.setItem,_get=Storage.prototype.getItem;",
        "  var PREFIX='__kbst_';",
        "  function isOwn(k){ return !k||k.indexOf('kb_')===0||k.toLowerCase().indexOf('token')>=0||k.indexOf(PREFIX)===0; }",
        "  function snap(){ var d={}; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(isOwn(k)) continue; d[k]=localStorage.getItem(k);} return d; }",
        "  var pend=false;",
        "  function push(){ var data=snap(); var body=JSON.stringify({op:'state',action:'put',filename:KB_FILE,data:data,ts:Date.now()}); fetch(KB_API,{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':getTok()},body:body}).then(function(r){ if(r.status===401){ var n=window.parent.document.getElementById('note'); if(n){ n.style.display='flex'; n.innerHTML='<i class=\"fas fa-exclamation-circle\"></i> 登录已过期，请回到主站重新登录后刷新本页。'; } } }).catch(function(){}); }",
        "  Storage.prototype.setItem=function(k,v){ _set.apply(this,arguments); if(isOwn(k)) return; if(pend) return; pend=true; setTimeout(function(){ pend=false; push(); },700); };",
        "  if(KB_CLOUD&&KB_CLOUD.data){ var lts=parseInt(_get.call(localStorage,PREFIX+'ts')||'0',10); if(KB_CLOUD.ts>lts){ for(var k in KB_CLOUD.data){ if(KB_CLOUD.data.hasOwnProperty(k)) _set.call(localStorage,k,KB_CLOUD.data[k]); } _set.call(localStorage,PREFIX+'ts',String(KB_CLOUD.ts)); } }",
        "})();"
      ];
      return '<script>' + lines.join('\n') + '<\/script>';
    }

    // 在 <head> 起始处注入 <base>(让相对资源正确解析) 与同步桥脚本
    function injectHead(html, baseHref, shim) {
      var base = '<base href="' + baseHref + '">';
      var inject = base + shim;
      if (/<head[^>]*>/i.test(html)) return html.replace(/<head([^>]*)>/i, '<head$1>' + inject);
      if (/<html[^>]*>/i.test(html)) return html.replace(/<html([^>]*)>/i, '<html$1><head>' + inject + '</head>');
      return '<head>' + inject + '</head>' + html;
    }

    if (!f) { showMsg('缺少文件参数', true); return; }

    var ext = (f.split('.').pop() || '').toLowerCase();

    if (ext === 'md') {
      // Markdown：站内渲染为富文本，再放进沙箱 iframe（不透明源，无法读取同域 localStorage/cookie）
      fetch(rawUrl).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function(txt) {
        var body;
        if (window.marked && marked.parse) {
          try { body = marked.parse(txt); } catch(e) { body = '<pre>' + txt.replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) + '</pre>'; }
        } else {
          body = '<pre>' + txt.replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}) + '</pre>';
        }
        var doc = MD_TMPL.replace('__BODY__', body);
        frame.removeAttribute('src');
        frame.srcdoc = doc;
      }).catch(function(err) { showError('加载失败，请重试或下载原文件', rawUrl, err); });
      return;
    }

    if (ext === 'html' || ext === 'htm') {
      // 看板类 HTML：同域 iframe 打开(localStorage 可用) + 云端同步勾选状态。点击即直接用，无需再点「直接打开」。
      // 看板显示不依赖云端：云端 get 带 4s 超时 + 容错，挂了也不阻塞渲染（用本地 localStorage）。
      // 注意：必须用 overlay 显示「加载中」，绝不能 showMsg 改写 body.innerHTML —— 那会把 iframe 从 DOM 移除导致永不渲染。
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      var token = (localStorage.getItem('kb_admin_token') || sessionStorage.getItem('kb_admin_token') || '');
      var boardDir = new URL('reports/', location.href).href;
      var loading = document.getElementById('loading');
      loading.style.display = 'flex';
      // 1) 先取看板内容（同源，应很快）
      fetch(rawUrl).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
        .then(function(htmlText){
          // 2) 并行拉云端勾选状态：带 4s 超时 + 容错，绝不阻塞看板显示
          var cloud = null;
          var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 4000);
          return fetch(KB_SCF_API, {
              method:'POST',
              headers:{'Content-Type':'application/json','x-admin-token':token},
              body: JSON.stringify({ op:'state', action:'get', filename:f }),
              signal: ctrl ? ctrl.signal : undefined
            })
            .then(function(r){ return r.status===200 ? r.json() : null; })
            .then(function(j){ if(j && j.ok) cloud = { data:j.data, ts:j.ts }; })
            .catch(function(){ /* 云端不可用则用本地存储，不影响显示 */ })
            .then(function(){ clearTimeout(timer); return htmlText; });
        })
        .then(function(htmlText){
          // 3) 渲染看板（cloud 为 null 时走本地 localStorage，跨设备还原仅在云端可达时生效）
          loading.style.display = 'none';
          frame.srcdoc = injectHead(htmlText, boardDir, buildStateShim(KB_SCF_API, f, cloud));
          // 按用户要求：不再显示同步提示条
        })
        .catch(function(err){
          loading.style.display = 'none';
          showError('加载失败，请重试或下载原文件', rawUrl, err);
        });
      return;
    }

    // 其它类型不应走查看页：直接引导下载
    showMsg('该格式不支持在线预览，请使用「下载原文件」', true);
  })();

  var MD_TMPL = [
    '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width,initial-scale=1">',
    '<style>',
    '*{box-sizing:border-box}',
    'body{margin:0;background:#fff;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.75;',
    '-webkit-font-smoothing:antialiased}',
    '.md{max-width:860px;margin:0 auto;padding:40px 28px 80px}',
    'h1,h2,h3,h4{color:#1f2329;font-weight:700;line-height:1.4;margin:28px 0 14px}',
    'h1{font-size:26px;padding-bottom:12px;border-bottom:1px solid #eceef1}',
    'h2{font-size:21px;padding-bottom:8px;border-bottom:1px solid #f0f1f3}',
    'h3{font-size:18px}h4{font-size:16px}',
    'p{margin:12px 0;color:#2b2f36}',
    'a{color:#2f6fed;text-decoration:none}a:hover{text-decoration:underline}',
    'strong{font-weight:700;color:#1f2329}',
    'em{color:#51565d}',
    'ul,ol{padding-left:24px;margin:12px 0}',
    'li{margin:6px 0}',
    'blockquote{margin:14px 0;padding:8px 16px;background:#f7f8fa;border-left:4px solid #d0d3d9;color:#646a73;border-radius:0 4px 4px 0}',
    'blockquote p{margin:4px 0;color:#646a73}',
    'code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;background:#f2f3f5;color:#d6336c;padding:2px 6px;border-radius:4px}',
    'pre{margin:14px 0;padding:16px;background:#1f2329;border-radius:8px;overflow:auto}',
    'pre code{background:transparent;color:#e6e6e6;padding:0;font-size:13px;line-height:1.6}',
    'table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}',
    'th,td{border:1px solid #e5e6eb;padding:8px 12px;text-align:left}',
    'th{background:#f7f8fa;font-weight:600;color:#1f2329}',
    'tr:nth-child(even) td{background:#fafbfc}',
    'img{max-width:100%;border-radius:6px;margin:8px 0}',
    'hr{border:none;border-top:1px solid #eceef1;margin:24px 0}',
    '</style></head><body><div class="md" id="c">__BODY__</div></body></html>'
  ].join('\n');
  </script>
</body>
</html>
