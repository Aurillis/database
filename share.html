<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分享 · report-portal</title>
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f6f8;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .topbar{height:52px;background:#1a1a2e;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff}
  .topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .topbar a{color:#cfd2ff;text-decoration:none;font-size:13px}
  .topbar a:hover{text-decoration:underline}
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}
  .card{background:#fff;border:1px solid #eceef1;border-radius:12px;padding:26px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .ftitle{font-size:24px;font-weight:700;margin:0 0 10px;line-height:1.4}
  .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;font-size:13px;color:#646a73}
  .fmt-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .exp{font-size:12px;padding:2px 10px;border-radius:20px;background:#fff4e6;color:#b25e09}
  .exp.ok{background:#e8f5ec;color:#1a7f37}
  .actions{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:#2f6fed;color:#fff}
  .btn-ghost{background:#f2f3f5;color:#1f2329}
  .btn:hover{opacity:.9}
  .divider{height:1px;background:#f0f1f3;margin:22px 0}
  .notice{padding:14px 16px;border-radius:8px;font-size:14px;line-height:1.6}
  .notice.err{background:#fff0f0;color:#c0392b}
  .notice.warn{background:#fff8e6;color:#9a6a00}
  .md{max-width:100%;line-height:1.75;font-size:15px}
  .md h1,.md h2,.md h3,.md h4{line-height:1.4;margin:24px 0 12px;color:#1f2329}
  .md h1{font-size:24px;padding-bottom:10px;border-bottom:1px solid #eceef1}
  .md h2{font-size:20px;padding-bottom:6px;border-bottom:1px solid #f0f1f3}
  .md p{margin:12px 0;color:#2b2f36}
  .md a{color:#2f6fed;text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md strong{color:#1f2329}
  .md ul,.md ol{padding-left:22px;margin:12px 0}
  .md li{margin:6px 0}
  .md blockquote{margin:14px 0;padding:8px 16px;background:#f7f8fa;border-left:4px solid #d0d3d9;color:#646a73;border-radius:0 4px 4px 0}
  .md code{font-family:Consolas,Menlo,monospace;font-size:13px;background:#f2f3f5;color:#d6336c;padding:2px 6px;border-radius:4px}
  .md pre{margin:14px 0;padding:16px;background:#1f2329;border-radius:8px;overflow:auto}
  .md pre code{background:transparent;color:#e6e6e6;padding:0}
  .md table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
  .md th,.md td{border:1px solid #e5e6eb;padding:8px 12px;text-align:left}
  .md img{max-width:100%;border-radius:6px;margin:8px 0}
  .md hr{border:none;border-top:1px solid #eceef1;margin:22px 0}
  .shared-img{max-width:100%;border-radius:8px;border:1px solid #eceef1;margin-top:8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #cbd2dc;border-top-color:#2f6fed;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand"><i class="fas fa-share-alt"></i> report-portal · 单篇分享</span>
    <a href="index.html"><i class="fas fa-home"></i> 回到网站</a>
  </div>
  <div class="wrap">
    <div id="app"><div class="card"><p style="color:#646a73"><span class="spin"></span> 加载中…</p></div></div>
  </div>

<script src="vendor/marked/marked.min.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(ts){if(!ts)return '—';var d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function fmtSize(b){if(!b&&b!==0)return '';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}
  function fileExt(n){var i=n.lastIndexOf('.');return i<0?'':n.slice(i+1).toLowerCase();}
  function fmtColor(n){var map={html:'#e34c26',htm:'#e34c26',pdf:'#d63031',doc:'#2b579a',docx:'#2b579a',xls:'#217346',xlsx:'#217346',csv:'#217346',ppt:'#d24726',pptx:'#d24726',md:'#3182ce',png:'#16a34a',jpg:'#16a34a',jpeg:'#16a34a',gif:'#16a34a',svg:'#16a34a',zip:'#8b5cf6',rar:'#8b5cf6',txt:'#6b7280'};return map[fileExt(n)]||'#6b7280';}
  function fileFmt(n){var map={html:'HTML',htm:'HTML',pdf:'PDF',doc:'Word',docx:'Word',xls:'Excel',xlsx:'Excel',csv:'Excel',ppt:'PPT',pptx:'PPT',md:'Markdown',png:'图片',jpg:'图片',jpeg:'图片',gif:'图片',svg:'图片',zip:'压缩包',rar:'压缩包',txt:'文本'};return map[fileExt(n)]||'文件';}

  var SHARE_MD_TMPL = [
    '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width,initial-scale=1">',
    '<style>',
    '*{box-sizing:border-box}',
    'body{margin:0;background:#fff;color:#1f2329;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.75;',
    '-webkit-font-smoothing:antialiased}',
    '.md{max-width:860px;margin:0 auto;padding:32px 24px 80px}',
    'h1,h2,h3,h4{color:#1f2329;font-weight:700;line-height:1.4;margin:28px 0 14px}',
    'h1{font-size:26px;padding-bottom:12px;border-bottom:1px solid #eceef1}',
    'h2{font-size:21px;padding-bottom:8px;border-bottom:1px solid #f0f1f3}',
    'h3{font-size:18px}h4{font-size:16px}',
    'p{margin:12px 0;color:#2b2f36}',
    'a{color:#2f6fed;text-decoration:none}a:hover{text-decoration:underline}',
    'strong{font-weight:700;color:#1f2329}',
    'em{color:#51565d}',
    'ul,ol{padding-left:24px;margin:12px 0}',
    'li{margin:6px 0}',
    'blockquote{margin:14px 0;padding:8px 16px;background:#f7f8fa;border-left:4px solid #d0d3d9;color:#646a73;border-radius:0 4px 4px 0}',
    'blockquote p{margin:4px 0;color:#646a73}',
    'code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;background:#f2f3f5;color:#d6336c;padding:2px 6px;border-radius:4px}',
    'pre{margin:14px 0;padding:16px;background:#1f2329;border-radius:8px;overflow:auto}',
    'pre code{background:transparent;color:#e6e6e6;padding:0;font-size:13px;line-height:1.6}',
    'table{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}',
    'th,td{border:1px solid #e5e6eb;padding:8px 12px;text-align:left}',
    'th{background:#f7f8fa;font-weight:600;color:#1f2329}',
    'tr:nth-child(even) td{background:#fafbfc}',
    'img{max-width:100%;border-radius:6px;margin:8px 0}',
    'hr{border:none;border-top:1px solid #eceef1;margin:24px 0}',
    '</style></head><body><div class="md" id="c">__BODY__</div></body></html>'
  ].join('\n');

  var app=document.getElementById('app');
  var qs=new URLSearchParams(location.search);
  var token=qs.get('t');
  if(!token){renderError('链接无效','该分享链接缺少必要的参数。');return;}

  fetch('shares.json?t='+Date.now()).then(function(r){return r.status===200?r.json():[];}).then(function(list){
    list=Array.isArray(list)?list:[];
    var rec=list.filter(function(x){return x.token===token;})[0];
    if(!rec){renderError('链接无效或已失效','没有找到对应的分享记录，可能链接已过期或被删除。');return;}
    if(rec.expireAt && Date.now()>rec.expireAt){renderError('链接已过期','该分享链接已超过设定的有效期。');return;}
    renderReport(rec);
  }).catch(function(){renderError('加载失败','无法读取分享数据，请稍后重试。');});

  function renderError(title,msg){
    app.innerHTML='<div class="card"><div class="notice err"><strong>'+esc(title)+'</strong><br>'+esc(msg)+'</div></div>';
  }

  function renderReport(rec){
    var fn=rec.filename, ext=fileExt(fn), color=fmtColor(fn);
    var expHtml='';
    if(rec.expireAt){
      var left=Math.ceil((rec.expireAt-Date.now())/86400000);
      expHtml='<span class="exp">'+'有效期至 '+fmtDate(rec.expireAt)+'（剩 '+left+' 天）</span>';
    } else {
      expHtml='<span class="exp ok">永久有效</span>';
    }
    var head=''
      +'<div class="card">'
      +'<h1 class="ftitle">'+esc(rec.title||fn)+'</h1>'
      +'<div class="meta">'
      +'<span class="fmt-badge" style="background:'+color+'1a;color:'+color+'">'+fileFmt(fn)+'</span>'
      +'<span>创建于 '+fmtDate(rec.created)+'</span>'
      +expHtml
      +'</div>';

    if(ext==='md'){
      // Markdown：渲染后放进沙箱 iframe（无 allow-same-origin → 不透明源，无法读取父页 localStorage/cookie）
      app.innerHTML=head+'<div class="divider"></div>'
        +'<iframe id="mdframe" sandbox="allow-scripts" referrerpolicy="no-referrer" style="width:100%;height:72vh;border:1px solid #eceef1;border-radius:8px;background:#fff"></iframe>'
        +'</div>';
      fetch('reports/'+encodeURIComponent(fn)).then(function(r){return r.ok?r.text():Promise.reject('missing');}).then(function(txt){
        var body=(window.marked&&marked.parse)?marked.parse(txt):'<pre>'+esc(txt)+'</pre>';
        var doc=SHARE_MD_TMPL.replace('__BODY__', body);
        var fr=document.getElementById('mdframe');
        fr.removeAttribute('src');
        fr.srcdoc=doc;
      }).catch(function(){
        var fr=document.getElementById('mdframe');
        if(fr) fr.srcdoc='<div style="padding:24px;font-family:sans-serif;color:#9a6a00">该文件已不存在或无法读取。</div>';
      });
      return;
    }
    if(['png','jpg','jpeg','gif','svg','webp'].indexOf(ext)>=0){
      app.innerHTML=head+'<div class="divider"></div><img class="shared-img" src="reports/'+encodeURIComponent(fn)+'" alt="'+esc(fn)+'"></div>';
      return;
    }
    // 其它格式：提供打开/下载
    var url='reports/'+encodeURIComponent(fn);
    app.innerHTML=head
      +'<div class="actions">'
      +'<a class="btn btn-primary" href="'+esc(url)+'" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> 打开 / 下载</a>'
      +'<a class="btn btn-ghost" href="'+esc(url)+'" download><i class="fas fa-download"></i> 下载到本地</a>'
      +'</div>'
      +'<p style="font-size:12px;color:#9699a0;margin-top:10px">该文件将在新标签页打开。若浏览器拦截，请允许弹出窗口或右键「打开链接」。</p>'
      +'</div>';
  }
})();
</script>
</body>
</html>
